name: CI

# Builds and tests on all three supported platforms.
#
# This is the only source of Windows and macOS evidence: the project is developed
# on Linux, and a great deal of its cross-platform correctness (path handling, the
# absent control socket on Windows, process and socket APIs) is otherwise only
# checked by reading source. Compiling and running the suite on real runners is
# what turns those claims into observations.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Cross-built on Linux with mingw-w64 and *run natively* by the Windows leg
  # below — exactly how release.yml produces and verifies the PEs it ships, so
  # a per-PR regression in the shipping assembler or linker fails here rather
  # than at release time.
  vasm-windows:
    name: vasm (windows cross-build)
    runs-on: ubuntu-latest
    steps:
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Fetch, verify and cross-build vasm and vlink
        run: |
          set -euo pipefail
          # Same pinned source as the other legs and the release.
          VASM_URL=http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          VASM_SHA256=c84b2de1cbb87831795fe64a85c5d9a7002a766e3a7c30b0a2d7d5e99d878f49
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | sha256sum -c -
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot CC=x86_64-w64-mingw32-gcc
          file vasm/vasmm68k_mot.exe
          # vlink, from the same author: its Win32FromLinux makefile hardcodes
          # the 32-bit triplet, so the compilers are overridden to x86_64.
          VLINK_URL=http://sun.hasenbraten.de/vlink/release/vlink.tar.gz
          VLINK_SHA256=8d151cdd30a4feb575a364e68810c2bc300fe1a7c074dbbee6fd1175a6c5bfae
          curl -fsSL -o vlink.tar.gz "$VLINK_URL"
          echo "$VLINK_SHA256  vlink.tar.gz" | sha256sum -c -
          tar xzf vlink.tar.gz
          make -C vlink -f Makefile.Win32FromLinux \
            CC=x86_64-w64-mingw32-gcc LD=x86_64-w64-mingw32-gcc
          file vlink/vlink.exe

      # Staged flat: upload-artifact preserves the directory structure of
      # multiple paths relative to their common ancestor, so uploading the two
      # build trees would put each exe inside vasm/ and vlink/ subdirectories
      # the Windows leg never looks in.
      - name: Stage the Windows tools
        run: |
          mkdir -p windows-tools
          cp vasm/vasmm68k_mot.exe vlink/vlink.exe windows-tools/

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-windows-exe
          path: windows-tools
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Every leg waits for the cross-build: cheap, and it keeps the artifact
    # available to the Windows leg below.
    needs: vasm-windows

    strategy:
      # A failure on one platform must not hide the others: the whole point is
      # seeing all three results side by side.
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
            vasm: true
            emulator: true
          # Pinned rather than macos-latest: that currently resolves to
          # macos-26, where Apple removed the AGL framework and Qt 6.8 still
          # references it, so linking fails inside Qt's own CMake config. Pinning
          # keeps a working signal; testing macOS 26 needs a Qt whose
          # FindWrapOpenGL.cmake no longer names AGL.
          - name: macOS (clang)
            os: macos-15
            vasm: true
            # The emulator runs here since the build-hatari action configures
            # with ENABLE_OSX_BUNDLE=OFF: the default bundle build's binary
            # only runs from inside Hatari.app, which is what used to park
            # this leg.
            emulator: true
          # No MSYS2 Hatari package exists, so the native backend is exercised
          # against the official pinned Windows binary (downloaded below) and
          # the HRDB transport against the fork, built here with MSYS2. The
          # stock build has no control socket (POSIX-only), so the socket-
          # gated tests skip themselves by capability probe — honest, since
          # that is exactly what a stock-Hatari Windows session can do.
          - name: Windows (MSVC)
            os: windows-latest
            vasm: false
            # The shipping Windows assembler and linker (cross-built above)
            # are run natively here.
            windowsVasm: true
            emulator: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: ''

      # vasm is the assembler PiST drives. It is built from the author's source
      # rather than downloaded, because no binaries are published for host
      # platforms — only Amiga-family and Atari targets. Building it here also
      # means the emulator and build tests exercise a real assembler instead of
      - name: Build vasm and vlink (Linux/macOS)
        if: matrix.vasm
        shell: bash
        run: |
          set -euo pipefail
          VASM_URL=http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          # Pinned: an unexpected change upstream must fail loudly rather than
          # silently altering what we test against.
          VASM_SHA256=c84b2de1cbb87831795fe64a85c5d9a7002a766e3a7c30b0a2d7d5e99d878f49
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c -
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          # vlink, same author and same discipline: tst_link's end-to-end case
          # needs it, and skips without it.
          VLINK_URL=http://sun.hasenbraten.de/vlink/release/vlink.tar.gz
          VLINK_SHA256=8d151cdd30a4feb575a364e68810c2bc300fe1a7c074dbbee6fd1175a6c5bfae
          curl -fsSL -o vlink.tar.gz "$VLINK_URL"
          echo "$VLINK_SHA256  vlink.tar.gz" | shasum -a 256 -c -
          tar xzf vlink.tar.gz
          make -C vlink
          mkdir -p "$HOME/.local/bin"
          cp vasm/vasmm68k_mot vlink/vlink "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Windows leg runs the shipping assembler and linker natively: a real
      # assembly and a real link, not just a version print, so a broken PE
      # fails here.
      - name: Download the Windows vasm and vlink
        if: matrix.windowsVasm
        uses: actions/download-artifact@v4
        with:
          name: vasm-windows-exe
          path: ${{ runner.temp }}/vasm-win

      - name: Verify the Windows vasm assembles and vlink links
        if: matrix.windowsVasm
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/vasm-win/vasmm68k_mot.exe"
          "$EXE" 2>&1 | head -1
          printf '\ttext\nstart:\tmove.l\t#1,d0\n\trts\n\tend\n' > smoke.s
          "$EXE" -quiet -Ftos -o smoke.prg smoke.s
          # A TOS executable starts with the 0x601A branch magic.
          test "$(od -An -tx1 -N2 smoke.prg | tr -d ' ')" = "601a"
          # The linker, exercised the way a multi-file project uses it: two
          # vasm objects linked into one TOS program (the tst_link fixture's
          # own shape).
          printf '\ttext\n\txdef\tstart\n\txref\thelper\nstart:\tmoveq\t#1,d0\n\tbsr\thelper\nloop:\tbra.s\tloop\n\tend\n' > main.s
          printf '\ttext\n\txdef\thelper\nhelper:\tmoveq\t#3,d0\n\trts\n\tend\n' > lib.s
          "$EXE" -quiet -Fvobj -o main.o main.s
          "$EXE" -quiet -Fvobj -o lib.o lib.s
          "$RUNNER_TEMP/vasm-win/vlink.exe" -b ataritos -o smoke2.prg main.o lib.o
          test "$(od -An -tx1 -N2 smoke2.prg | tr -d ' ')" = "601a"
          # Put them on PATH for the build and test steps. tst_gui's
          # initTestCase skips the whole suite when findExecutable cannot
          # resolve vasmm68k_mot, so a leg that downloads and verifies the
          # assembler but never publishes it reports green while contributing
          # zero assertions from its largest suite.
          echo "$RUNNER_TEMP/vasm-win" >> "$GITHUB_PATH"


      - name: Prove the Windows tools resolve on PATH
        if: matrix.windowsVasm
        shell: bash
        run: |
          set -euo pipefail
          # The previous step's PATH append only takes effect here, so prove
          # the entry rather than assume it: Qt's findExecutable applies
          # PATHEXT, and these are the names the test suite looks for.
          command -v vasmm68k_mot.exe
          command -v vlink.exe

      # Build the pinned Hatari. The rationale for the version, the checksum and
      # the per-platform details lives with the build, in
      # ./.github/actions/build-hatari — the release packaging job calls the same
      # action, so there is only one copy of these steps to fix. The gate stays
      # here: the emulator is only built and exercised where the matrix asks for
      # it.
      - name: Build Hatari
        if: matrix.emulator && runner.os != 'Windows'
        uses: ./.github/actions/build-hatari
        with:
          destination: ${{ runner.temp }}/hatari-bin

      # On Windows the native backend is exercised against the official stock
      # binary rather than a source build: it is what a Windows user actually
      # gets from hatari-emu.org, and it has no control socket, which is the
      # configuration the socket-gated tests exist to skip. Pinned by checksum
      # like every other input.
      - name: Download stock Hatari (Windows)
        if: matrix.emulator && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o hatari-win.zip \
            https://framagit.org/hatari/releases/-/raw/main/v2.6.1/hatari-2.6.1_windows64.zip
          echo "996ff8df1fd6bd909ded90d5460d5639f3d8dee2c74921f3983a4cd10ff02812  hatari-win.zip" \
            | sha256sum -c -
          python3 - <<'PY'
          import zipfile, os
          dest = os.path.join(os.environ["RUNNER_TEMP"], "hatari-stock")
          with zipfile.ZipFile("hatari-win.zip") as z:
              z.extractall(dest)
          print("extracted to", dest)
          PY
          echo "$RUNNER_TEMP/hatari-stock/hatari-2.6.1_windows64" >> "$GITHUB_PATH"

      # The HRDB fork: on Linux/macOS side by side with the upstream build, on
      # Windows built with MSYS2 by the same action. The tst_hrdb suite and the
      # gui transport-swap tests run against it, and the bundled emulator in a
      # release *is* this fork (release.yml), so CI must exercise the transport
      # that ships — on Windows it is also the only build with working pause.
      - name: Build Hatari (hrdb fork)
        if: matrix.emulator
        uses: ./.github/actions/build-hatari
        with:
          variant: hrdb
          binary-name: hatari-hrdb
          destination: ${{ runner.temp }}/hatari-hrdb-bin
      - name: Verify the emulator build
        if: matrix.emulator
        run: |
          set -euo pipefail
          command -v hatari || command -v hatari.exe
          # No `hatari --version` on Windows: Hatari's info options open a
          # console and then wait for Enter (Win_ForceCon + Main_ErrorExit),
          # which would hang the step until the job timeout. The test binaries
          # verify the build by content probe instead (HatariProbe scans the
          # binary on Windows precisely because of this).
          if [ "${{ runner.os }}" != "Windows" ]; then
            hatari --version 2>&1 | sed -n '1p' || true
          fi

      - name: Fetch a ROM
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roms"
          curl -fsSL -o "$RUNNER_TEMP/emutos.zip" \
            https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-1024k-1.4.zip/download
          echo "dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1  $RUNNER_TEMP/emutos.zip" \
            | shasum -a 256 -c - 2>/dev/null \
            || echo "dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1  $RUNNER_TEMP/emutos.zip" \
            | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, shutil, os
          temp = os.environ["RUNNER_TEMP"]
          with zipfile.ZipFile(f"{temp}/emutos.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("etos1024k.img"))
              z.extract(name, f"{temp}/emutos-extract")
          src = next(pathlib.Path(f"{temp}/emutos-extract").rglob("etos1024k.img"))
          shutil.copy(src, f"{temp}/roms/etos1024k.img")
          print("ROM:", f"{temp}/roms/etos1024k.img")
          PY

      - name: Verify the assembler runs
        if: matrix.vasm
        shell: bash
        run: |
          vasmm68k_mot 2>&1 | head -1

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          gen=()
          if [ "${{ runner.os }}" = "macOS" ] && command -v ninja >/dev/null 2>&1; then
            gen=(-G Ninja)
          fi
          cmake -S . -B build "${gen[@]}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # The integration suites skip themselves when Hatari or a TOS ROM is
      # absent, which is the case on every runner. They report as skipped rather
      # than passed, so a green run never overstates what was verified.
      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # Tell the emulator suite that its prerequisites are meant to be
          # present, so a missing one fails instead of silently skipping. Without
          # this the whole suite could report as skipped and the run would look
          # green while the most fragile part of the project went untested.
          PIST_REQUIRE_EMULATOR: ${{ matrix.emulator && '1' || '' }}
          PIST_TOS_DIR: ${{ matrix.emulator && format('{0}/roms', runner.temp) || '' }}
          # The HRDB suites run against the fork built above; without it they
          # skip (developer machines) rather than fail (they are not part of
          # the require-emulator contract, which is about upstream Hatari).
          PIST_HRDB_HATARI: ${{ matrix.emulator && format('{0}/hatari-hrdb-bin/hatari-hrdb{1}', runner.temp, runner.os == 'Windows' && '.exe' || '') || '' }}
          # Runners have no display. Hatari uses SDL for video, so it needs the
          # dummy driver — the debugger transport and the emulated machine are
          # unaffected, which is all this suite exercises.
          SDL_VIDEODRIVER: dummy
        run: |
          if ctest --test-dir build --build-config Release --output-on-failure; then
            exit 0
          fi

          # ctest's output capture proved unreliable here — on Windows a failing
          # test reported no output at all — so re-run verbosely, which makes
          # ctest print each test's command line and its output.
          echo
          echo "### verbose re-run to capture the failures"
          ctest --test-dir build --build-config Release -V || true

          # Last resort: run each test binary directly. Two traps shaped this:
          # the glob must name real executables only — build/tst_* also matches
          # MSBuild artefacts (*.vcxproj) and directories (tst_*.dir/), and an
          # exec failure under bash -e used to abort the step before it printed
          # anything — and the log must go to a file, because a crashing test
          # can take its pipe-buffered stdout with it while QTest's file logger
          # flushes every message.
          echo
          echo "### direct runs with redirected output"
          shopt -s nullglob
          exes=(build/Release/tst_*.exe)
          for f in build/tst_*; do
            # Single-config tree: keep extension-less regular files only, so
            # build artefacts can never reach the exec.
            case "$f" in *.*) continue ;; esac
            [ -f "$f" ] && exes+=("$f")
          done
          for exe in "${exes[@]}"; do
            out=$(mktemp)
            code=0
            "$exe" -o "$out,txt" > /dev/null 2>&1 || code=$?
            echo "--- $exe (exit $code) ---"
            cat "$out"
            rm -f "$out"
            [ "$code" -eq 0 ] && continue
            # A failing binary gets per-function isolation: each function in its
            # own process, so even a hard crash that swallows all output still
            # names the function that was running. (tr strips the CRLF and sed
            # the trailing "()" the Windows binary puts on its -functions lines.)
            for fn in $("$exe" -functions 2>/dev/null | tr -d '\r' | sed 's/()$//'); do
              fnout=$(mktemp)
              fncode=0
              "$exe" "$fn" -o "$fnout,txt" > /dev/null 2>&1 || fncode=$?
              if [ "$fncode" -ne 0 ]; then
                echo "    FAILED (exit $fncode): $fn"
                cat "$fnout"
              fi
              rm -f "$fnout"
            done
          done
          exit 1

      - name: Report test summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Re-running ctest here used to abort the widget tests: this step
          # has no QT_QPA_PLATFORM=offscreen, so the summary contradicted a
          # green Test step. Quote the Test step's own log instead.
          log=build/Testing/Temporary/LastTest.log
          if [ -f "$log" ]; then
            tail -25 "$log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no LastTest.log (tests did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install (staged)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/stage"
          find stage -type f | sort

      # Proves the installed tree is self-sufficient rather than merely present.
      - name: Verify the installed binary starts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The installed location differs per platform: macOS gets an application
          # bundle (its executable lives inside Contents/MacOS), unlike the plain
          # bin/ layout elsewhere. Missing this made the install check fail on
          # macOS alone after the bundle change.
          BIN="$GITHUB_WORKSPACE/stage/bin/pist"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          [ -f "$BIN" ] || BIN="$GITHUB_WORKSPACE/stage/pist.app/Contents/MacOS/pist"
          if [ ! -f "$BIN" ]; then
            echo "no installed binary found; staged tree:"
            find "$GITHUB_WORKSPACE/stage" -type f | sort
            exit 1
          fi
          echo "using $BIN"
          "$BIN" --version
          "$BIN" --diagnose
          ls "$GITHUB_WORKSPACE/stage/share/doc/pist"
