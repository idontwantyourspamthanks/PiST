name: CI

# Builds and tests on all three supported platforms.
#
# This is the only source of Windows and macOS evidence: the project is developed
# on Linux, and a great deal of its cross-platform correctness (path handling, the
# absent control socket on Windows, process and socket APIs) is otherwise only
# checked by reading source. Compiling and running the suite on real runners is
# what turns those claims into observations.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A failure on one platform must not hide the others: the whole point is
      # seeing all three results side by side.
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
            vasm: true
            emulator: true
          # Pinned rather than macos-latest: that currently resolves to
          # macos-26, where Apple removed the AGL framework and Qt 6.8 still
          # references it, so linking fails inside Qt's own CMake config. Pinning
          # keeps a working signal; testing macOS 26 needs a Qt whose
          # FindWrapOpenGL.cmake no longer names AGL.
          - name: macOS (clang)
            os: macos-15
            vasm: true
            emulator: true
          # No Hatari package for MSYS2, so Windows builds and unit-tests but
          # cannot exercise the emulator. Its emulator suite therefore skips
          # rather than failing, which is honest as long as its green means less.
          - name: Windows (MSVC)
            os: windows-latest
            vasm: false
            emulator: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: ''

      # vasm is the assembler PiST drives. It is built from the author's source
      # rather than downloaded, because no binaries are published for host
      # platforms — only Amiga-family and Atari targets. Building it here also
      # means the emulator and build tests exercise a real assembler instead of
      # skipping.
      - name: Build vasm (Linux/macOS)
        if: matrix.vasm
        shell: bash
        run: |
          set -euo pipefail
          VASM_URL=http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          # Pinned: an unexpected change upstream must fail loudly rather than
          # silently altering what we test against.
          VASM_SHA256=c84b2de1cbb87831795fe64a85c5d9a7002a766e3a7c30b0a2d7d5e99d878f49
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c -
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          mkdir -p "$HOME/.local/bin"
          cp vasm/vasmm68k_mot "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Build the Hatari we actually support, rather than taking whatever the
      # distribution ships. Ubuntu 24.04 packages 2.4.1 and 22.04 ships 2.3.1,
      # while this project is developed and verified against 2.6.1 — and the
      # difference is not cosmetic: running the suite against 2.4.1 produced
      # truncated debugger responses and four failures that do not reproduce on
      # 2.6.1 at all. Testing a version nobody will use is worse than useless,
      # because the failures are noise and the passes are meaningless.
      #
      # This is also the build we intend to bundle in release archives, so the
      # path is worth having proven. Pinned by checksum: an upstream change should
      # fail loudly rather than quietly alter what is tested.
      - name: Build Hatari
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          HATARI_URL=https://github.com/hatari/hatari/archive/refs/tags/v2.6.1.tar.gz
          HATARI_SHA256=75f09c8deddb511b8c1574b84c507743097db9abc6edbb078f942efa8677547e
          curl -fsSL -o hatari.tar.gz "$HATARI_URL"
          echo "$HATARI_SHA256  hatari.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$HATARI_SHA256  hatari.tar.gz" | sha256sum -c -
          tar xzf hatari.tar.gz

          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq
            # libreadline-dev matters: with it, Hatari's debugger reads commands
            # through readline and prints its prompt to stdout. Without it, the
            # build falls back to fgets and prints the prompt to stderr, which is
            # a different transport path entirely — so the dependency is part of
            # what is being tested, not an incidental.
            sudo apt-get install -y -qq libsdl2-dev libpng-dev zlib1g-dev libreadline-dev
          else
            brew install sdl2 libpng
          fi

          cmake -S hatari-2.6.1 -B hatari-build -DCMAKE_BUILD_TYPE=Release
          cmake --build hatari-build --parallel

          mkdir -p "$HOME/.local/bin"
          find hatari-build -name hatari -type f -executable -exec cp {} "$HOME/.local/bin/hatari" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A free ROM so the emulator suites have something to boot. Pinned by
      # checksum for the same reason vasm is: an upstream change should fail
      # loudly rather than silently altering what is tested.
      - name: Verify the emulator build
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          command -v hatari
          hatari --version 2>&1 | sed -n '1p' || true

      - name: Fetch a ROM
        if: matrix.emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roms"
          curl -fsSL -o "$RUNNER_TEMP/emutos.zip" \
            https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-1024k-1.4.zip/download
          echo "dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1  $RUNNER_TEMP/emutos.zip" \
            | shasum -a 256 -c - 2>/dev/null \
            || echo "dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1  $RUNNER_TEMP/emutos.zip" \
            | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, shutil, os
          temp = os.environ["RUNNER_TEMP"]
          with zipfile.ZipFile(f"{temp}/emutos.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("etos1024k.img"))
              z.extract(name, f"{temp}/emutos-extract")
          src = next(pathlib.Path(f"{temp}/emutos-extract").rglob("etos1024k.img"))
          shutil.copy(src, f"{temp}/roms/etos1024k.img")
          print("ROM:", f"{temp}/roms/etos1024k.img")
          PY

      - name: Verify the assembler runs
        if: matrix.vasm
        shell: bash
        run: |
          vasmm68k_mot 2>&1 | head -1

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # The integration suites skip themselves when Hatari or a TOS ROM is
      # absent, which is the case on every runner. They report as skipped rather
      # than passed, so a green run never overstates what was verified.
      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # Tell the emulator suite that its prerequisites are meant to be
          # present, so a missing one fails instead of silently skipping. Without
          # this the whole suite could report as skipped and the run would look
          # green while the most fragile part of the project went untested.
          PIST_REQUIRE_EMULATOR: ${{ matrix.emulator && '1' || '' }}
          PIST_TOS_DIR: ${{ matrix.emulator && format('{0}/roms', runner.temp) || '' }}
          # Runners have no display. Hatari uses SDL for video, so it needs the
          # dummy driver — the debugger transport and the emulated machine are
          # unaffected, which is all this suite exercises.
          SDL_VIDEODRIVER: dummy
        run: |
          if ctest --test-dir build --build-config Release --output-on-failure; then
            exit 0
          fi

          # ctest's output capture proved unreliable here — on Windows a failing
          # test reported no output at all — so re-run verbosely, which makes
          # ctest print each test's command line and its output. Locating the
          # binaries by hand was tried and is worse: build artefacts such as
          # *.vcxproj also match a `tst_*` glob.
          echo
          echo "### verbose re-run to capture the failures"
          ctest --test-dir build --build-config Release -V || true

          # Last resort: run each test binary with its output redirected to a
          # file, which captures output even when ctest's capture does not.
          echo
          echo "### direct runs with redirected output"
          for exe in build/tst_* build/Release/tst_*.exe; do
            [ -f "$exe" ] || continue
            case "$exe" in *.exe.recipe|*.lib|*.pdb) continue ;; esac
            out=$(mktemp)
            "$exe" > "$out" 2>&1
            code=$?
            echo "--- $exe (exit $code) ---"
            tail -30 "$out"
            rm -f "$out"
          done
          exit 1

      - name: Report test summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ctest --test-dir build --build-config Release 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install (staged)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/stage"
          find stage -type f | sort

      # Proves the installed tree is self-sufficient rather than merely present.
      - name: Verify the installed binary starts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The installed location differs per platform: macOS gets an application
          # bundle (its executable lives inside Contents/MacOS), unlike the plain
          # bin/ layout elsewhere. Missing this made the install check fail on
          # macOS alone after the bundle change.
          BIN="$GITHUB_WORKSPACE/stage/bin/pist"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          [ -f "$BIN" ] || BIN="$GITHUB_WORKSPACE/stage/pist.app/Contents/MacOS/pist"
          if [ ! -f "$BIN" ]; then
            echo "no installed binary found; staged tree:"
            find "$GITHUB_WORKSPACE/stage" -type f | sort
            exit 1
          fi
          echo "using $BIN"
          "$BIN" --version
          "$BIN" --diagnose
          ls "$GITHUB_WORKSPACE/stage/share/doc/pist"
