name: Release

# Produces shippable archives containing PiST, the assembler, and a free ROM, so
# that a fresh download runs without the user installing anything.
#
# The assembler is bundled because vasm publishes no binaries for host platforms
# at all — only Amiga-family and Atari builds — so it has to be compiled here. Its
# licence permits redistribution unmodified for non-commercial use; see NOTICE.
# It is never patched: PiST drives it purely through command-line arguments.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # await-ci reads the CI workflow's runs for the commit being tagged.
  actions: read

env:
  VASM_URL: http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
  VASM_SHA256: c84b2de1cbb87831795fe64a85c5d9a7002a766e3a7c30b0a2d7d5e99d878f49
  # vlink, the linker for multi-file projects: same author, same licence shape
  # (unmodified redistribution, non-commercial use), so it ships under the same
  # terms vasm does — and its licence text must travel the same way.
  VLINK_URL: http://sun.hasenbraten.de/vlink/release/vlink.tar.gz
  VLINK_SHA256: 8d151cdd30a4feb575a364e68810c2bc300fe1a7c074dbbee6fd1175a6c5bfae
  # EmuTOS 1.4, the 1024k emulator build: one image that works on ST through
  # Falcon, and the same one Hatari itself ships. Verified to autostart a GEMDOS
  # HD program, which is what the run-and-debug path needs.
  EMUTOS_URL: https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-1024k-1.4.zip/download
  EMUTOS_SHA256: dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1
  # The Qt the bundles deploy; collect-notices names it in the LGPL source
  # offer, so it must be the version install-qt-action actually installs.
  QT_VERSION: '6.8.1'
  # The in-process core the macOS app seals into Contents/Frameworks.
  # idontwantyourspamthanks/hatari branch pist-libretro. The checksum is the
  # GitHub archive of that commit, the same check the hrdb pin uses.
  PIST_HATARI_COMMIT: e3c224008ca2a004792a105d4558b607877e5d1a
  PIST_HATARI_SHA256: e26488d22f2f3308fea80bb03076ae20984b92ff196ae0ef3fa8682ce8ad8a3b

jobs:
  # ---------------------------------------------------------------------------
  # Build the assembler and the linker.
  #
  # The Windows build is cross-compiled here with mingw-w64 rather than built on a
  # Windows runner with MSYS2: it is one plain-C program with no platform API
  # beyond stdio, and a cross-built PE is then *run natively* by the Windows
  # release job, which verifies it more directly than building it there would.
  # macOS is built natively, since cross-compiling to Mach-O from Linux needs an
  # SDK we cannot ship here.
  # ---------------------------------------------------------------------------
  vasm-linux-windows:
    name: vasm (linux + windows)
    runs-on: ubuntu-latest
    steps:
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Fetch and verify vasm source
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | sha256sum -c -
          tar xzf vasm.tar.gz

      - name: Build for Linux
        run: |
          set -euo pipefail
          make -C vasm CPU=m68k SYNTAX=mot
          curl -fsSL -o vlink.tar.gz "$VLINK_URL"
          echo "$VLINK_SHA256  vlink.tar.gz" | sha256sum -c -
          tar xzf vlink.tar.gz
          make -C vlink

      - name: Build for Windows
        run: |
          set -euo pipefail
          cp -r vasm vasm-win
          make -C vasm-win CPU=m68k SYNTAX=mot CC=x86_64-w64-mingw32-gcc
          file vasm-win/vasmm68k_mot.exe
          # vlink's Win32FromLinux makefile hardcodes the 32-bit triplet, so
          # the compilers are overridden to x86_64. Freshly extracted, not a
          # copy of the Linux build tree: that tree's host-compiled objects
          # satisfy make's timestamps, and mingw-ld then links glibc symbols
          # (__fprintf_chk and friends) and fails.
          mkdir vlink-win
          tar xzf vlink.tar.gz -C vlink-win --strip-components=1
          make -C vlink-win -f Makefile.Win32FromLinux \
            CC=x86_64-w64-mingw32-gcc LD=x86_64-w64-mingw32-gcc
          file vlink-win/vlink.exe

      # Staged flat, one directory per platform: upload-artifact preserves the
      # directory structure of multiple paths relative to their common
      # ancestor, so the two build trees would arrive nested and the package
      # job's bundle/bin would miss them.
      - name: Stage the tool artifacts
        run: |
          mkdir -p dist-linux dist-windows
          cp vasm/vasmm68k_mot vlink/vlink dist-linux/
          cp vasm-win/vasmm68k_mot.exe vlink-win/vlink.exe dist-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-linux
          path: dist-linux
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-windows
          path: dist-windows
          if-no-files-found: error

  vasm-macos:
    name: vasm (macos)
    runs-on: macos-15
    steps:
      - name: Fetch and verify vasm source
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c -
          tar xzf vasm.tar.gz

      - name: Build
        run: |
          set -euo pipefail
          make -C vasm CPU=m68k SYNTAX=mot
          curl -fsSL -o vlink.tar.gz "$VLINK_URL"
          echo "$VLINK_SHA256  vlink.tar.gz" | shasum -a 256 -c -
          tar xzf vlink.tar.gz
          make -C vlink

      # Staged flat: uploading the two build trees as two paths would nest
      # them under vasm/ and vlink/ in the artifact (common-ancestor rule).
      - name: Stage the tool artifact
        run: |
          mkdir -p dist-macos
          cp vasm/vasmm68k_mot vlink/vlink dist-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-macos
          path: dist-macos
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Do not publish what CI has not passed.
  #
  # The tag and the CI run share a commit but not a trigger: CI runs on the push
  # to master, this workflow on the tag push, so nothing ordered them. 0.8.2 was
  # tagged while its CI run was still in flight — and that run was red, carrying
  # a project-save bug tst_settings catches on the Qt these archives bundle. All
  # seven assets published anyway.
  #
  # Waiting beats re-testing here. CI already runs the suite on all three
  # platforms against the right emulators: upstream Hatari for the native
  # transport and the fork for HRDB. This workflow's bundle/bin holds only the
  # fork, whose stdin debugger is dead, so the native-transport suites cannot run
  # against it at all (docs/PLAN.md §9) — a ctest step here would either fail or
  # have to skip exactly the integration coverage that matters.
  # ---------------------------------------------------------------------------
  await-ci:
    name: wait for CI on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Block until the CI workflow has passed this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # 60 attempts x 30 s = 30 minutes. CI bounds its own test step at 45,
          # so a run still going when this gives up is a release nobody should
          # be waiting on anyway; re-tagging resumes from a green run.
          for attempt in $(seq 1 60); do
            # --repo is spelled out because this job has no checkout: with an
            # empty workspace gh has no git remote to infer the repository from,
            # and the runner exports GITHUB_REPOSITORY but not GH_REPO.
            runs="$(gh run list --repo "${{ github.repository }}" \
                      --workflow ci.yml --commit "$sha" \
                      --json databaseId,status,conclusion --limit 10)"
            total="$(jq 'length' <<<"$runs")"
            finished="$(jq '[.[] | select(.status == "completed")] | length' <<<"$runs")"
            if [ "$total" -eq 0 ]; then
              # A manual run builds the archives as artifacts and does not
              # publish. A tag on a commit that never went to master has
              # nothing to wait for and nothing that vouches for the tree.
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "No CI run for $sha. Building artifacts only; this is not a release."
                exit 0
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "No CI run exists for $sha."
                echo "This workflow publishes only what CI has passed: push the commit"
                echo "to master first (or retag one that was), then run this again."
                exit 1
              fi
            elif [ "$finished" -eq "$total" ]; then
              bad="$(jq -r '[.[] | select(.conclusion != "success") | .databaseId]
                            | join(" ")' <<<"$runs")"
              if [ -n "$bad" ]; then
                echo "CI did not pass $sha — failing run(s): $bad"
                echo "Nothing is published until it does."
                exit 1
              fi
              echo "CI passed $sha ($total run(s)); packaging may proceed."
              exit 0
            fi
            echo "CI on ${sha:0:7}: $finished/$total complete — waiting"
            sleep 30
          done
          echo "CI on ${sha:0:7} did not finish inside the release window"
          exit 1

  # ---------------------------------------------------------------------------
  # Build PiST, assemble the archive, and verify it before it is published.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.name }})
    needs: [vasm-linux-windows, vasm-macos, await-ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage rather than a plain tarball, because it is the only Linux
          # format that is self-contained, runs on distros other than the build
          # host, and sidesteps the archive-area policy problem of shipping a
          # non-free assembler (an AppImage is not a distro package, so the DFSG
          # does not apply — only vasm's own redistribution terms do).
          # emulator: Linux and Windows bundle the hrdb-main fork of Hatari —
          # on Windows it is what gives the archive pause and live breakpoints,
          # since the stock Windows build has no control channel. macOS does
          # not bundle that executable: it links Homebrew SDL2. The Mac app
          # seals hatari_libretro.dylib instead, built below with SDL stubbed
          # out so the link line is libm and libz.
          - name: linux-x86_64
            os: ubuntu-22.04
            vasm_artifact: vasm-linux
            deployed: false
            emulator: true
          - name: macos-arm64
            os: macos-15
            vasm_artifact: vasm-macos
            deployed: true
            emulator: false
          - name: windows-x86_64
            os: windows-latest
            vasm_artifact: vasm-windows
            deployed: true
            emulator: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      # The licence terms of the bundled assembler and linker live only in
      # their source tarballs' manuals, and they must travel with the binaries
      # — so the packaging job needs both tarballs, pinned exactly as the
      # build jobs.
      - name: Fetch and verify the vasm and vlink sources (for their licences)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$VASM_SHA256  vasm.tar.gz" | sha256sum -c -
          curl -fsSL -o vlink.tar.gz "$VLINK_URL"
          echo "$VLINK_SHA256  vlink.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$VLINK_SHA256  vlink.tar.gz" | sha256sum -c -

      # The Mac embed is this dylib, not a Hatari executable. SDL is the stub
      # in the fork, so nothing from Homebrew is on the link line. The copy
      # into the app happens in the seal step, which is the last modification
      # before the signature.
      - name: Build the in-process core (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o hatari-pist.tar.gz \
            "https://github.com/idontwantyourspamthanks/hatari/archive/${PIST_HATARI_COMMIT}.tar.gz"
          echo "$PIST_HATARI_SHA256  hatari-pist.tar.gz" | shasum -a 256 -c -
          rm -rf hatari-pist-src
          mkdir hatari-pist-src
          tar -xzf hatari-pist.tar.gz -C hatari-pist-src --strip-components=1
          cmake -S hatari-pist-src -B hatari-pist-build \
            -DPIST_LIBRETRO=1 -DPIST_LIBRETRO_STUB_SDL=1 \
            -DENABLE_OSX_BUNDLE=0 -DENABLE_MAN_PAGES=0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build hatari-pist-build --target hatari_libretro --parallel
          test -f hatari-pist-build/src/hatari_libretro.dylib
          otool -L hatari-pist-build/src/hatari_libretro.dylib > otool-core.txt
          cat otool-core.txt
          if grep -q /opt/homebrew otool-core.txt; then
            echo "ERROR: the core links Homebrew"
            exit 1
          fi
          grep -q libz otool-core.txt \
            || { echo "ERROR: the core does not link libz"; exit 1; }

      # xvfb and the ALSA/X libraries are needed for two different reasons: xvfb to
      # run the AppImage at all (the offscreen plugin is deliberately not bundled),
      # and the libraries so that the AppImage has something to *fail* against. The
      # smoke test is dishonest if the runner happens to have everything.

      - name: Install the emulator and its libraries
        if: matrix.emulator && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libsdl2-2.0-0 libpng16-16

      # Same action the test job uses, so the emulator that ships is one the
      # test suites ran against. On Windows this is the MSYS2 ucrt64 build and
      # the action stages its runtime DLLs beside the exe; on Linux the
      # AppImage deploy step bundles its libraries.
      - name: 'Build Hatari (the bundled emulator: hrdb fork)'
        if: matrix.emulator
        uses: ./.github/actions/build-hatari
        with:
          # The bundled emulator is the hrdb-main FORK, installed as `hatari`:
          # one emulator, and PiST's content probe selects HRDB automatically
          # for it. The fork is upstream 2.6.1 plus the remote-debug listener,
          # so emulation is identical to what CI tests against upstream; the
          # native backend remains for user-supplied stock Hatari. Conveyed as
          # GPLv2: three of the files it compiles in grant version 2 alone, so
          # the source offer names the pinned fork commit and no GPLv3 library
          # joins it (NOTICE, docs/PLAN.md §10).
          variant: hrdb
          destination: ${{ github.workspace }}/bundle/bin

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.vasm_artifact }}
          path: bundle/bin

      # Artifacts do not preserve the executable bit, so a downloaded assembler is
      # present but not runnable, and discovery rightly skips it — which shipped an
      # archive whose bundled assembler was reported NOT FOUND. Restore the mode
      # before it is used or packaged; tar preserves it, so the archive is correct.
      - name: Make the assembler executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bundle/bin/vasmm68k_mot bundle/bin/vlink
          ls -l bundle/bin/

      - name: Fetch and verify EmuTOS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o emutos.zip "$EMUTOS_URL"
          echo "$EMUTOS_SHA256  emutos.zip" | shasum -a 256 -c - 2>/dev/null \
            || echo "$EMUTOS_SHA256  emutos.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          with zipfile.ZipFile("emutos.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("etos1024k.img"))
              z.extract(name, "emutos-extract")
          dest = pathlib.Path("bundle/share/emutos")
          dest.mkdir(parents=True, exist_ok=True)
          src = next(pathlib.Path("emutos-extract").rglob("etos1024k.img"))
          shutil.copy(src, dest / "etos1024k.img")
          print("ROM:", dest / "etos1024k.img")
          PY

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          gen=()
          if [ "${{ runner.os }}" = "macOS" ] && command -v ninja >/dev/null 2>&1; then
            gen=(-G Ninja)
          fi
          cmake -S . -B build "${gen[@]}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # One derivation of the version every asset name below uses. On a tag push
      # github.ref_name is the tag itself — "v0.8.3" — and the "v" is not part of
      # the version. Interpolating it verbatim produced assets named
      # pist-v0.8.3-linux-amd64.deb, which a software centre truncates at the
      # first dot and reports as a package called "pist-v0".
      - name: Compute the release version
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          # A branch name can contain a slash. Asset filenames are paths.
          V="${V//\//-}"
          [ -n "$V" ] || V="dev"
          echo "PIST_VERSION=$V" >> "$GITHUB_ENV"
          echo "release version: $V"

      # Deploy the Qt runtime so the archive runs on a machine without Qt
      # installed. Without this the binary links against the Qt it was built with
      # and fails to start elsewhere — the same failure the CI install step hit
      # on macOS as "Library not loaded: @rpath/QtWidgets.framework/...".
      - name: Deploy Qt runtime (macOS)
        if: matrix.deployed && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp -R build/pist.app bundle/
          # pist-mcp rides inside the app bundle: Contents/MacOS is where its
          # rpath resolves the Qt macdeployqt deploys into Contents/Frameworks.
          cp build/pist-mcp bundle/pist.app/Contents/MacOS/
          macdeployqt bundle/pist.app -always-overwrite \
            -executable=bundle/pist.app/Contents/MacOS/pist-mcp
          # The helper must resolve Qt from the bundle it rides in, not the host.
          # macdeployqt writes @loader_path for helpers (the loader is the
          # executable, so this resolves to the same Contents/Frameworks).
          otool -L bundle/pist.app/Contents/MacOS/pist-mcp \
            | grep -q '@loader_path/../Frameworks/QtCore.framework' \
            || { echo "ERROR: pist-mcp not fixed up into the bundle"; \
                 otool -L bundle/pist.app/Contents/MacOS/pist-mcp; exit 1; }
          # The assembler and linker belong beside the executable inside the
          # bundle, which is where discovery looks first, so the archive stays
          # self-sufficient wherever it is unpacked from.
          cp bundle/bin/vasmm68k_mot bundle/bin/vlink bundle/pist.app/Contents/MacOS/
          rm -rf bundle/bin
          find bundle -maxdepth 4 -type f | head -20
          # The bundle presents itself as PiST rather than as the target name:
          # CFBundleName is what Finder shows under the icon and what the menu bar
          # shows while the app runs, and MACOSX_BUNDLE_BUNDLE_NAME sets it.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' bundle/pist.app/Contents/Info.plist \
            | grep -qx PiST \
            || { echo "ERROR: the bundle's CFBundleName is not PiST:"; \
                 /usr/libexec/PlistBuddy -c Print bundle/pist.app/Contents/Info.plist | head -20; exit 1; }

      - name: Deploy Qt runtime (Windows)
        if: matrix.deployed && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin
          cp build/Release/pist.exe build/Release/pist-mcp.exe bundle/bin/
          # pist-mcp.exe links only Qt6Core and Qt6Network, both of which the
          # pist.exe deploy already places beside it, so it needs no pass of
          # its own.
          # --no-compiler-runtime: on an MSVC release build windeployqt's
          # compiler-runtime step stages vc_redist.x64.exe — a ~20 MB installer
          # nothing tells the user to run — instead of the DLLs themselves. The
          # CRT ships app-locally below, so the stray bootstrapper is dropped.
          windeployqt --release --no-translations --no-compiler-runtime bundle/bin/pist.exe
          # windeployqt deploys Qt and nothing else, but pist.exe and every Qt
          # DLL import the MSVC runtime: on a clean Windows machine the launch
          # died with "MSVCP140.dll was not found", because the redistributable
          # is installed on the runner and so never showed up as missing there.
          # App-local deployment of the CRT family is what Microsoft's terms
          # permit and what a machine without the redistributable needs, and it
          # fixes the archive and the MSI alike, since both pack this bundle/.
          # vswhere names the toolset root on every Windows runner; the Redist
          # subfolder is the toolset version on some layouts and "v143"-style
          # on others, so glob and take the newest. Everything in that folder
          # is the CRT family (msvcp140*, vcruntime140*, concrt140, vccorlib140;
          # the OpenMP and MFC DLLs live in sibling folders), so copying the
          # folder cannot miss a name a future toolset adds.
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          crt=""
          if [ -x "$vswhere" ]; then
            vsroot="$("$vswhere" -latest -property installationPath | sed 's|\\|/|g' | head -1)"
            crt="$(ls -d "$vsroot/VC/Redist/MSVC/"*/x64/Microsoft.VC*.CRT 2>/dev/null \
                     | sort -V | tail -1 || true)"
          fi
          [ -n "$crt" ] || crt="$(ls -d "/c/Program Files/Microsoft Visual Studio"/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$crt" ] || { echo "ERROR: no MSVC Redist CRT found via vswhere or the install roots"; exit 1; }
          [ -e "$crt/msvcp140.dll" ] || { echo "ERROR: $crt holds no CRT DLLs"; ls "$crt"; exit 1; }
          cp "$crt"/*.dll bundle/bin/ || { echo "ERROR: copying $crt into bundle/bin failed"; exit 1; }
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            [ -f "bundle/bin/$dll" ] || { echo "ERROR: $dll did not land in bundle/bin (from $crt)"; exit 1; }
          done
          [ ! -e bundle/bin/vc_redist.x64.exe ] \
            || { echo "ERROR: windeployqt staged a redistributable installer"; exit 1; }
          # The Visual Studio generator writes no CMAKE_CXX_COMPILER entry into
          # the cache — the 0.8.6 echo proved the line absent rather than
          # mis-read — which is why the CRT is resolved with vswhere instead.
          # The echo stays as the record of that, and as an early warning should
          # a future generator start writing it again.
          grep -m1 "^CMAKE_CXX_COMPILER" build/CMakeCache.txt \
            || echo "note: no CMAKE_CXX_COMPILER line in build/CMakeCache.txt"
          ls -l bundle/bin/msvcp140.dll bundle/bin/vcruntime140.dll bundle/bin/vcruntime140_1.dll

      - name: Copy binary (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin
          cp build/pist bundle/bin/

      # The AppImage bundles Qt (including the xcb platform plugin, xcbgl
      # integrations and the TLS backends Qt6::Network needs), so it runs on a
      # machine with no Qt installed. Build on the oldest runner we support: glibc
      # is backward-compatible but not forward-compatible, so the build host sets
      # the floor for every distro the AppImage will run on.
      - name: Build AppImage (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail

          LD=linuxdeploy-x86_64.AppImage
          LDQ=linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o "$LD" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/$LD
          curl -fsSL -o "$LDQ" https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/$LDQ
          chmod +x "$LD" "$LDQ"

          # Stage an AppDir from the normal install tree, so packaging cannot drift
          # from what `cmake --install` produces.
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          # The icons come through the install rules now (CMakeLists.txt) — the
          # SVG and every raster size — so nothing is copied in here.

          # Bundle the tools the archive carries, beside the executable, which is
          # the first place tool discovery looks. One matrix flag drives both the
          # copy and the `-e` below, because splitting them means the AppImage
          # builds the moment the flag is flipped and then fails confusingly; kept
          # together, a no-emulator build is simply a smaller AppImage.
          cp bundle/bin/vasmm68k_mot bundle/bin/vlink AppDir/usr/bin/
          mkdir -p AppDir/usr/share/emutos
          cp bundle/share/emutos/etos1024k.img AppDir/usr/share/emutos/
          EXE_ARGS=(-e AppDir/usr/bin/pist)
          if [ "${{ matrix.emulator }}" = "true" ]; then
            cp bundle/bin/hatari AppDir/usr/bin/
            EXE_ARGS+=(-e AppDir/usr/bin/hatari)
          fi

          # The licence texts must be inside the AppDir before linuxdeploy
          # consumes it (a second pass is not an option: re-running the qt
          # plugin on a populated AppDir demands QML tooling a fresh AppDir
          # does not need). The set is derived from what was actually staged —
          # including the libraries the bundled Hatari links (Capstone comes
          # and goes with the build host) — so the notices cannot drift from
          # the bytes we ship. Qt lands during the deploy itself, hence
          # --expect-qt; the final artifact's notices are asserted below.
          python3 packaging/collect-notices.py --root AppDir/usr --platform linux \
            --qt-version "$QT_VERSION" --vasm-tarball vasm.tar.gz \
            --vlink-tarball vlink.tar.gz --expect-qt


          export QMAKE="$(command -v qmake6 || command -v qmake)"
          # Without VERSION, appimagetool names the artifact PiST-x86_64.AppImage
          # and stamps no version into its metadata, which is what 0.8.3 shipped.
          export VERSION="$PIST_VERSION"

          # Both executables are named with -e, which is what makes linuxdeploy
          # bundle the libraries they need that are NOT universal on a desktop:
          # with only `pist` named, the bundled Hatari arrived without SDL2 or
          # libpng and could not start. libreadline belonged to that list when
          # the failure was found; the emulator has since been built without it
          # (a licence constraint — see the dependency step and NOTICE), so the
          # assertion below names SDL2 and libpng only, and a readline in the
          # bundle would be a defect rather than a missing dependency.
          #
          # X11, Wayland, libdrm, libgbm and libasound are deliberately NOT
          # bundled, and that is linuxdeploy's own choice rather than an
          # oversight: every desktop Linux has them, and copying them from the
          # build host is actively dangerous. A library copied from a newer host
          # can demand a glibc the user does not have — copying libtinfo from a
          # development machine produced "version `GLIBC_2.42' not found" on a
          # 2.39 system, turning a working archive into a broken one. Testing in a
          # headless container therefore proves less than it appears to: a missing
          # libasound there is not a defect, because no desktop lacks it.
          ./"$LD" --appdir AppDir \
            "${EXE_ARGS[@]}" \
            -d AppDir/usr/share/applications/pist.desktop \
            -i packaging/icons/pist-256.png \
            --plugin qt --output appimage


          APPIMAGE=$(ls PiST-*.AppImage | head -1)
          echo "built $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"
          # The artifact must carry the version. appimagetool names it from
          # $VERSION (exported above — the plugin passes that variable straight
          # through) and stamps the same value into the metadata a launcher reads.
          case "$APPIMAGE" in
            *"$PIST_VERSION"*) ;;
            *) echo "ERROR: the AppImage is not versioned: $APPIMAGE"; exit 1 ;;
          esac

          # Verify what will actually be published, by running the bundled
          # emulator itself rather than only asking pist where it thinks the
          # emulator is. An emulator that cannot start is the failure this step
          # exists to catch, and `--diagnose` would report it as present.
          echo "--- extracting the published AppImage to inspect it ---"
          rm -rf verify-appimage && mkdir -p verify-appimage
          (cd verify-appimage && "../$APPIMAGE" --appimage-extract > /dev/null)

          if [ ! -x verify-appimage/squashfs-root/usr/bin/hatari ]; then
            echo "ERROR: no emulator inside the AppImage"
            exit 1
          fi
          # Asserted on the output rather than the exit status, because Hatari
          # exits 1 from --version while printing a perfectly good banner (it
          # reports the version and then fails its own "no ROM specified" path).
          # An emulator that cannot load its libraries produces a dynamic-linker
          # error and no banner at all, so the banner is the signal that matters;
          # `&& exit 1` here would have failed a working build.
          echo "--- bundled hatari --version ---"
          verify-appimage/squashfs-root/usr/bin/hatari --version > hatari-version.txt 2>&1 || true
          sed -n '1,3p' hatari-version.txt
          if ! grep -qE 'Hatari v[0-9]+\.[0-9]+' hatari-version.txt; then
            echo "ERROR: the bundled emulator does not start. Output was:"
            cat hatari-version.txt
            exit 1
          fi

          # The libraries linuxdeploy must be bundling, because a desktop without
          # them exists. SDL2 in particular is not universally installed, whereas
          # the excluded X11/ALSA set effectively is. readline is deliberately
          # NOT bundled: the conveyed Hatari is GPLv2-capped (three GPL-2.0-only
          # files — see NOTICE and PLAN §10), so the GPLv3 library cannot join
          # it, and the build pins that with CMAKE_DISABLE_FIND_PACKAGE_Readline.
          for lib in libSDL2-2.0 libpng; do
            if ! find verify-appimage/squashfs-root/usr/lib -name "$lib*" | grep -q .; then
              echo "ERROR: $lib was not bundled; the emulator needs it"
              exit 1
            fi
          done

          # The notices must travel too, and they must be the generated set.
          for f in THIRD-PARTY.txt licenses/GPL-2.0.txt licenses/GPL-3.0.txt \
                   licenses/LGPL-3.0.txt licenses/zlib.txt licenses/SDL2-LICENSE.txt \
                   licenses/libpng.txt licenses/vasm-LICENCE.txt licenses/vlink-LICENCE.txt; do
            if [ ! -f "verify-appimage/squashfs-root/usr/share/doc/pist/$f" ]; then
              echo "ERROR: the AppImage lacks doc/pist/$f"
              exit 1
            fi
          done
          echo "OK: emulator starts and its non-universal libraries are bundled"

          echo "--- $APPIMAGE --diagnose ---"
          # Run through xvfb: the offscreen platform plugin is not bundled, and
          # xcb is what a user gets. A real display is closer to the shipped
          # configuration than a plugin that is not in the archive.
          mkdir -p fakehome
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            xvfb-run -a "./$APPIMAGE" --diagnose > diagnose-appimage.txt 2>&1 || true
          cat diagnose-appimage.txt

          # The same assertions the archive job makes, applied to the AppImage —
          # and pointedly WITHOUT PIST_TOS_DIR, so that the discovery logic a user
          # depends on is the logic being tested. The archive check sets that
          # variable, which is why a bundled ROM that nothing searched still passed
          # the release gate.
          for needle in vasmm68k_mot hatari EmuTOS; do
            if ! grep -q "$needle" diagnose-appimage.txt; then
              echo "ERROR: the AppImage did not report $needle"
              exit 1
            fi
          done

          # The bundled emulator must be the HRDB fork: the content probe is
          # what selects the transport, so an upstream binary here would
          # silently ship the wrong debug channel.
          if ! grep -q 'transport: hrdb' diagnose-appimage.txt; then
            echo "ERROR: the bundled emulator is not the HRDB fork:"
            cat diagnose-appimage.txt
            exit 1
          fi
          # And the ROM it must be *using* has to be the one inside the AppImage,
          # not a system copy that happened to be on the runner. A user without the
          # hatari package has no system copy, so this is the case that matters.
          # The EmuTOS line is matched by its path rather than a leading version
          # number, because EmuTOS does not render as one: it prints
          # "EmuTOS (TOS 2.06)<TAB>/tmp/.mount_.../usr/share/emutos/etos1024k.img",
          # and an earlier version of this check expected a number and therefore
          # passed on a machine where only the system ROMs were found.
          if ! grep -qE '/tmp/\.mount_[^[:space:]]+/usr/share/emutos/etos1024k\.img' diagnose-appimage.txt; then
            echo "ERROR: the AppImage did not find its own bundled ROM:"
            cat diagnose-appimage.txt
            exit 1
          fi
          # The bundled ROM must also be usable, not merely present. "cannot
          # autostart" would mean the GEMDOS-hard-disk run path is broken, which is
          # what Run and debug both need. Matched on the EmuTOS line itself, so a
          # system 1.02 ROM — which always carries that warning — does not produce
          # a false failure.
          if grep -E 'etos1024k\.img' diagnose-appimage.txt | grep -q 'cannot autostart'; then
            echo "ERROR: the bundled EmuTOS cannot autostart a program"
            exit 1
          fi

          echo "ASSET=$APPIMAGE" >> "$GITHUB_ENV"
          echo "APPIMAGE=1" >> "$GITHUB_ENV"

      # Installers from the same staged *content* the AppImage carries — bundled
      # Qt, fork, vasm, ROM, licences and notices — rearranged into the layout a
      # distro package needs. The AppDir's layout is the AppImage's, and three
      # things about it are wrong in a package:
      #
      #   * linuxdeploy copies the build host's copyright file for every library
      #     it bundles into usr/share/doc/<package>/. Inside an AppImage that is
      #     attribution; inside a .deb those are paths dpkg knows belong to
      #     libglib2.0-0, libpulse0, libxcb-* and forty more installed packages,
      #     and dpkg will not take a file away from another package. `dpkg -i` on
      #     0.8.3 aborted with "trying to overwrite
      #     '/usr/share/doc/libglib2.0-0/copyright'" — the deb was uninstallable
      #     on any machine that has those libraries, which is every machine. The
      #     texts are moved under PiST's own doc directory rather than dropped:
      #     they are the terms of binaries this package really does carry.
      #   * the AppImage machinery at the root (AppRun, AppRun.wrapped, .DirIcon,
      #     apprun-hooks/ and the root-level pist.desktop and pist.svg symlinks)
      #     would be installed into /.
      #   * the bundle's libraries sat in /usr/lib, which ldconfig scans — and
      #     scans *before* /usr/lib/x86_64-linux-gnu, so with two copies of one
      #     soname in the cache the /usr/lib one is listed first and is what
      #     ld.so resolves. The package therefore made itself the system-wide
      #     provider of libQt6Core.so.6, libglib-2.0.so.0, libdbus-1.so.3 and
      #     forty more, for every other application on the machine.
      #
      # They move into the private prefix Debian policy asks for: /usr/lib/pist
      # is not scanned (ldconfig does not recurse), the binary's $ORIGIN/../lib
      # rpath and the qt.conf beside it resolve inside it unchanged, and the ROM
      # travels with them instead of into the public /usr/share/emutos that a
      # distro emutos package would also own. Only pist and pist-mcp are exposed
      # on PATH, so the bundled hatari, vasm and vlink cannot shadow a user's
      # own; PiST finds them beside its executable exactly as it does in the
      # AppImage.
      #
      # CPACK_INSTALL_CMAKE_PROJECTS="" suppresses the project's own install
      # rules so the package holds this tree and nothing else (a naive cpack
      # doubles the payload with both).
      - name: Build and install-test the deb and rpm (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rpm
          V="$PIST_VERSION"

          rm -rf PkgDir
          mkdir -p PkgDir/usr/lib/pist PkgDir/usr/lib/pist/share PkgDir/usr/bin
          for d in bin lib plugins; do
            if [ -e "AppDir/usr/$d" ]; then
              cp -a "AppDir/usr/$d" "PkgDir/usr/lib/pist/$d"
            fi
          done
          cp -a AppDir/usr/share/emutos PkgDir/usr/lib/pist/share/emutos
          ln -s ../lib/pist/bin/pist PkgDir/usr/bin/pist
          ln -s ../lib/pist/bin/pist-mcp PkgDir/usr/bin/pist-mcp

          # The public part of the tree: the menu entry, the icons and the
          # AppStream file a software centre reads the name, author and licence
          # from. Only PiST's own doc directory is taken as-is — see above.
          mkdir -p PkgDir/usr/share/doc/pist/licenses/distro
          for d in applications icons metainfo; do
            if [ -e "AppDir/usr/share/$d" ]; then
              cp -a "AppDir/usr/share/$d" "PkgDir/usr/share/$d"
            fi
          done
          cp -a AppDir/usr/share/doc/pist/. PkgDir/usr/share/doc/pist/
          for dir in AppDir/usr/share/doc/*/; do
            owner=$(basename "$dir")
            if [ "$owner" = pist ]; then continue; fi
            for f in "$dir"*; do
              if [ -e "$f" ]; then
                cp -a "$f" "PkgDir/usr/share/doc/pist/licenses/distro/$owner-$(basename "$f")"
              fi
            done
          done
          find PkgDir -type d -empty -delete

          # CMake 4's RelativePath requires an absolute directory; a relative
          # stage produced empty symlink names and aborted the package.
          stage=$(python3 -c "import os,sys; print(os.path.abspath(sys.argv[1]).replace(chr(92), '/'))" PkgDir)
          COMMON=(-D "CPACK_INSTALLED_DIRECTORIES=${stage};/"
                  -D "CPACK_INSTALL_CMAKE_PROJECTS=")
          cpack -G DEB "${COMMON[@]}" --config build/CPackConfig.cmake \
            -D CPACK_PACKAGE_FILE_NAME="PiST-$V-linux-amd64"
          cpack -G RPM "${COMMON[@]}" --config build/CPackConfig.cmake \
            -D CPACK_PACKAGE_FILE_NAME="PiST-$V-linux-x86_64"

          DEB="PiST-$V-linux-amd64.deb"
          RPM="PiST-$V-linux-x86_64.rpm"

          # What a package manager reports. Debian policy requires the lowercase
          # package name; the product name and the author come from CPack and
          # from the AppStream file.
          for field in "Package pist" "Maintainer Koala Software" "Version $V"; do
            key=${field%% *}
            got=$(dpkg-deb -f "$DEB" "$key")
            if [ "$got" != "${field#* }" ]; then
              echo "ERROR: deb $key is '$got', expected '${field#* }'"
              exit 1
            fi
          done
          rpm -qp --qf '%{NAME} %{LICENSE} %{VENDOR}\n' "$RPM" 2>/dev/null \
            | grep -qx "pist GPL-2.0-or-later Koala Software" \
            || { echo "ERROR: unexpected rpm metadata"; rpm -qip "$RPM"; exit 1; }

          # The payload, not just the control file: the licence statement, the
          # menu entry and the metadata a software centre needs must be in there,
          # and nothing may sit where another package's file already is.
          listing=$(dpkg-deb -c "$DEB")
          paths=$(echo "$listing" | awk '{print $6}')
          # Match the path field exactly: a listing line for a symlink also
          # carries its target, so an end-anchored grep on the whole line cannot
          # be used for anything here.
          for f in usr/lib/pist/bin/pist usr/share/applications/pist.desktop \
                   usr/share/metainfo/io.github.idontwantyourspamthanks.pist.metainfo.xml \
                   usr/share/doc/pist/copyright; do
            echo "$paths" | grep -qx "./$f" || { echo "ERROR: the deb lacks $f"; exit 1; }
          done
          # The two PATH entries are symlinks, and a listing line carries the
          # target as well as the name — assert both, because a symlink into the
          # private prefix that does not resolve is exactly what would leave the
          # menu entry pointing at nothing.
          for l in "usr/bin/pist -> ../lib/pist/bin/pist" \
                   "usr/bin/pist-mcp -> ../lib/pist/bin/pist-mcp"; do
            echo "$listing" | grep -qF " ./$l" || { echo "ERROR: the deb lacks $l"; exit 1; }
          done
          if echo "$listing" | grep -oE '\./usr/share/doc/[^/]+/' | sort -u \
               | grep -v '^\./usr/share/doc/pist/$' | grep -q .; then
            echo "ERROR: a foreign /usr/share/doc directory is in the stage; dpkg"
            echo "refuses to overwrite a file another package owns:"
            echo "$listing" | grep -oE '\./usr/share/doc/[^/]+/' | sort -u | head
            exit 1
          fi
          for pkg in "$DEB" "$RPM"; do
            case "$pkg" in
              *.deb) files=$(dpkg-deb -c "$pkg" | awk '{print $6}') ;;
              *)     files=$(rpm -qlp "$pkg" 2>/dev/null) ;;
            esac
            # A *shared object* directly in /usr/lib is the hazard: ldconfig scans
            # that directory — before the multiarch one — and caches every soname
            # it finds there, so every other application on the system would
            # resolve the bundle's Qt, glib or D-Bus instead of the distro's. The
            # check is limited to shared objects because the directories a package
            # legitimately owns there are not cached: /usr/lib/pist is the private
            # prefix itself, and rpmbuild adds /usr/lib/.build-id for its debuginfo
            # links (which is what tripped an earlier, broader form of this check).
            stray=$(echo "$files" | grep -E '^\.?/usr/lib/[^/]+\.so(\.[^/]*)?$' || true)
            if [ -n "$stray" ]; then
              echo "ERROR: $pkg puts a library directly in /usr/lib, where ldconfig"
              echo "would hand it to every other application on the system:"
              echo "$stray" | head
              exit 1
            fi
          done

          # The packages must be self-contained: the packaged pist resolves
          # its bundled Qt, tools and ROM from the staged tree, not the host.
          rm -rf debx && mkdir debx
          dpkg-deb -x "$DEB" debx
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            xvfb-run -a debx/usr/bin/pist --diagnose > diagnose-deb.txt 2>&1 || true
          # pist-mcp must resolve the bundled Qt too — it is not the --diagnose
          # binary, so it gets its own self-containment probe.
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            debx/usr/bin/pist-mcp --version | grep -q pist-mcp \
            || { echo "ERROR: deb pist-mcp not self-contained"; exit 1; }
          for needle in vasmm68k_mot hatari EmuTOS; do
            grep -q "$needle" diagnose-deb.txt \
              || { echo "ERROR: the deb does not report $needle"; cat diagnose-deb.txt; exit 1; }
          done
          grep -q 'debx/usr/lib/pist' diagnose-deb.txt \
            || { echo "ERROR: the deb resolves its tools outside its own tree"; cat diagnose-deb.txt; exit 1; }

          # Install it, for real, and remove it again. The runner has the very
          # system packages whose copyright files used to collide, so this is the
          # step that fails if a distro-owned path ever returns to the stage —
          # the failure 0.8.3 shipped with.
          sudo dpkg -i "$DEB"
          for f in /usr/bin/pist /usr/lib/pist/bin/pist \
                   /usr/share/metainfo/io.github.idontwantyourspamthanks.pist.metainfo.xml \
                   /usr/share/applications/pist.desktop /usr/share/doc/pist/copyright; do
            [ -e "$f" ] || { echo "ERROR: $f was not installed"; sudo dpkg -r pist; exit 1; }
          done
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            xvfb-run -a pist --diagnose > diagnose-installed.txt 2>&1 || true
          grep -q '/usr/lib/pist' diagnose-installed.txt \
            || { echo "ERROR: the installed pist does not resolve its own bundle:"
                 cat diagnose-installed.txt; sudo dpkg -r pist; exit 1; }
          sudo dpkg -r pist

          echo "ASSET_DEB=$DEB" >> "$GITHUB_ENV"
          echo "ASSET_RPM=$RPM" >> "$GITHUB_ENV"

      - name: Add documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/share/doc/pist
          cp LICENSE NOTICE README.md bundle/share/doc/pist/

      # Same derivation for the plain archives. Windows cannot inspect linked
      # libraries and bundles no emulator, so its set is the static one.
      - name: Generate third-party notices
        if: matrix.deployed
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=macos
          [ "${{ runner.os }}" = "Windows" ] && PLATFORM=windows
          python3 packaging/collect-notices.py --root bundle --platform "$PLATFORM" \
            --qt-version "$QT_VERSION" --vasm-tarball vasm.tar.gz \
            --vlink-tarball vlink.tar.gz

      # The point of the exercise: prove the packaged archive resolves the
      # assembler *it* carries, rather than one on the machine building it.
      - name: Verify the bundle resolves its own tools
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PIST_TOS_DIR: ${{ github.workspace }}/bundle/share/emutos
        run: |
          set -euo pipefail
          BIN=bundle/bin/pist
          [ -f "$BIN" ] || BIN="$BIN.exe"
          # On macOS the executable lives inside the .app bundle.
          [ -f "$BIN" ] || BIN=bundle/pist.app/Contents/MacOS/pist
          echo "--- $BIN --diagnose ---"
          "$BIN" --diagnose | tee diagnose.txt

          echo
          echo "Asserting the archive is self-sufficient..."

          # Compare by resolving what was actually reported rather than by
          # string-matching a path we compute here: Git-bash reports
          # /d/a/PiST/... while Qt reports D:/a/PiST/..., so an equality test
          # against a locally derived path fails on Windows for reasons that have
          # nothing to do with the bundle.
          reported="$(grep -F 'Assembler (vasmm68k_mot):' diagnose.txt \
                      | head -1 | sed 's/^Assembler (vasmm68k_mot): //' | tr -d '\r')"

          if [ "$reported" = "NOT FOUND" ] || [ -z "$reported" ]; then
            echo "ERROR: no assembler was found at all"
            exit 1
          fi
          if [ ! -f "$reported" ]; then
            echo "ERROR: the reported assembler does not exist: $reported"
            exit 1
          fi
          # It must be the copy travelling in this archive, not one installed on
          # the build machine — a bundle that ships a binary it does not use is
          # the failure this check exists to catch.
          case "$reported" in
            *bundle*) ;;
            *) echo "ERROR: resolved assembler is outside the bundle: $reported"; exit 1 ;;
          esac
          # And it must be byte-identical to what we packaged, which proves it is
          # our build rather than a same-named file that happened to be nearby.
          if ! cmp -s "$reported" "$(dirname "$reported")/vasmm68k_mot" \
             && ! cmp -s "$reported" "$(dirname "$reported")/vasmm68k_mot.exe"; then
            echo "ERROR: the resolved assembler is not the packaged one"
            exit 1
          fi

          # The linker gets the same treatment: bundled on every platform, and
          # the archive must resolve its own copy.
          linker="$(grep -F 'Linker (vlink):' diagnose.txt \
                    | head -1 | sed 's/^Linker (vlink): //' | tr -d '\r')"
          if [ "$linker" = "NOT FOUND" ] || [ -z "$linker" ]; then
            echo "ERROR: no linker was found at all"
            exit 1
          fi
          case "$linker" in
            *bundle*) ;;
            *) echo "ERROR: resolved linker is outside the bundle: $linker"; exit 1 ;;
          esac
          if ! cmp -s "$linker" "$(dirname "$linker")/vlink" \
             && ! cmp -s "$linker" "$(dirname "$linker")/vlink.exe"; then
            echo "ERROR: the resolved linker is not the packaged one"
            exit 1
          fi

          # The Windows archive bundles the hrdb fork (the MSYS2 build staged
          # into bundle/bin above): the diagnose output must name it, inside
          # the bundle, and the content probe must select HRDB — an upstream
          # binary here would ship the wrong debug channel.
          if [ "${{ runner.os }}" = "Windows" ]; then
            emu="$(grep -F 'Emulator (hatari):' diagnose.txt \
                   | head -1 | sed 's/^Emulator (hatari): //' | tr -d '\r')"
            case "$emu" in
              *bundle*) ;;
              *) echo "ERROR: resolved emulator is outside the bundle: $emu"; exit 1 ;;
            esac
            if ! grep -q 'transport: hrdb' diagnose.txt; then
              echo "ERROR: the bundled emulator is not the HRDB fork:"
              cat diagnose.txt
              exit 1
            fi
          fi

          # The ROM it carries must be recognised and usable: one that cannot
          # autostart would break the Run path, so copying a file in is not enough.
          if ! grep -q 'EmuTOS' diagnose.txt; then
            echo "ERROR: the bundled ROM was not found"
            exit 1
          fi
          if grep -q 'cannot autostart' diagnose.txt; then
            echo "ERROR: the bundled ROM cannot autostart a program"
            exit 1
          fi

          echo "OK: bundled assembler and ROM both resolved"

      - name: Write build metadata
        shell: bash
        run: |
          {
            echo "PiST ${{ github.ref_name }} (${{ matrix.name }})"
            echo "built from ${{ github.sha }}"
            echo
            cat diagnose.txt
          } > bundle/BUILD-INFO.txt

      # The macOS disk image is the app and an Applications folder. Everything
      # else — the ROM, the notices, the build record — has to be inside the
      # .app, or dragging the icon to Applications leaves it behind on the
      # volume. Finder labels the icon from the bundle's directory name, so
      # the shipped bundle is PiST.app; the build tree stays pist.app because
      # that is the target name.
      #
      # "PiST is damaged and can't be opened" is Launch Services rejecting a
      # bundle whose code signature does not match its contents. macdeployqt
      # rewrites install names, which invalidates the signature the linker
      # wrote, and the assembler is copied in after that. Signing has to be
      # the last modification. An ad-hoc signature is enough for the kernel
      # to accept the binary; a Developer ID (APPLE_SIGNING_IDENTITY) is used
      # when the release secrets provide one. Notarization is a further step
      # those secrets do not yet cover.
      - name: Seal the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # APFS on the runner is case-insensitive: renaming pist.app to
          # PiST.app in one step is the same directory and Finder keeps the
          # old spelling. Two steps change the catalog name.
          mv bundle/pist.app bundle/pist-rename.app
          mv bundle/pist-rename.app bundle/PiST.app
          APP=bundle/PiST.app
          test ! -e "$APP/Contents/share"
          mv bundle/share "$APP/Contents/share"
          mkdir -p "$APP/Contents/Resources"
          mv bundle/BUILD-INFO.txt "$APP/Contents/Resources/BUILD-INFO.txt"

          # The icon Finder draws. iconutil wants a full iconset; the PNGs
          # already in the tree are the source, scaled to the sizes it names.
          iconset=$(mktemp -d)/pist.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" packaging/icons/pist-512.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icons/pist-512.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$APP/Contents/Resources/pist.icns"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIconFile pist' \
            "$APP/Contents/Info.plist"

          # The in-process core. Copied before the signature, which has to be
          # the last modification of the bundle.
          mkdir -p "$APP/Contents/Frameworks"
          cp hatari-pist-build/src/hatari_libretro.dylib \
            "$APP/Contents/Frameworks/hatari_libretro.dylib"

          # A quarantined file copied into the bundle is itself enough for
          # Gatekeeper to call the app damaged.
          xattr -cr "$APP"

          identity="${APPLE_SIGNING_IDENTITY:--}"
          sign() {
            if [ "$identity" = "-" ]; then
              codesign --force --sign - "$1"
            else
              codesign --force --sign "$identity" --timestamp --options runtime "$1"
            fi
          }
          # Loose Mach-O first (plugins, the assembler, the helper, the
          # executable). Binaries inside a framework are signed with the
          # framework directory, not on their own. The scan is not a pipeline:
          # under pipefail the read at EOF would fail the step.
          list=$(mktemp)
          raw=$(mktemp)
          find "$APP" -type f -print0 > "$raw"
          while IFS= read -r -d '' p; do
            case "$p" in
              *.framework/*) continue ;;
            esac
            if file -b "$p" | grep -q 'Mach-O'; then
              printf '%s\n' "$p"
            fi
          done < "$raw" > "$list"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            sign "$path" || exit 1
          done < <(awk '{ print length, $0 }' "$list" | sort -nr | cut -d' ' -f2-)
          find "$APP" -depth -type d \( -name '*.framework' -o -name '*.bundle' \) \
            -print > "$list"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            sign "$path" || exit 1
          done < "$list"
          sign "$APP" || exit 1
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The ROM has to be found with no PIST_TOS_DIR: that variable is how
          # the earlier check skipped the discovery this layout depends on.
          "$APP/Contents/MacOS/pist" --diagnose > diagnose-sealed.txt
          grep -q 'PiST.app/Contents/share/emutos' diagnose-sealed.txt \
            || { echo "ERROR: the sealed app does not find its own ROM"; \
                 cat diagnose-sealed.txt; exit 1; }
          grep -q 'PiST.app/Contents/MacOS/vasmm68k_mot' diagnose-sealed.txt \
            || { echo "ERROR: the sealed app does not find its own assembler"; \
                 cat diagnose-sealed.txt; exit 1; }
          grep -q 'PiST.app/Contents/Frameworks/hatari_libretro.dylib' diagnose-sealed.txt \
            || { echo "ERROR: the sealed app does not find its libretro core"; \
                 cat diagnose-sealed.txt; exit 1; }

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          # Linux already produced its asset (the AppImage) above; the others get
          # an archive.
          if [ -n "${APPIMAGE:-}" ]; then
            ls -l "$ASSET"
            exit 0
          fi

          # The generated notices must be inside what ships — asserting on the
          # tree being archived, not on the script having run. On macOS that
          # tree is inside the app; the disk image has nowhere else to put it.
          DOC="bundle/share/doc/pist"
          if [ "${{ runner.os }}" = "macOS" ]; then
            DOC="bundle/PiST.app/Contents/share/doc/pist"
          fi
          for f in THIRD-PARTY.txt licenses/LGPL-3.0.txt licenses/vasm-LICENCE.txt licenses/vlink-LICENCE.txt; do
            if [ ! -f "$DOC/$f" ]; then
              echo "ERROR: the archive lacks $DOC/$f"
              exit 1
            fi
          done

          V="$PIST_VERSION"
          NAME="PiST-$V-${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" ./bundle/* > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" bundle
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l "$NAME".*

      # The disk image is not the staged tree. CPack's DragNDrop packs whatever
      # directory it is given and adds an Applications symlink, which is how the
      # volume came to show the app, share/, BUILD-INFO.txt and the shortcut.
      # A Mac disk image is the application and a link to /Applications.
      # ditto, not cp: Qt's frameworks are symlink trees, and a copy that
      # flattens them or drops the signature is the other way an app becomes
      # "damaged" on the far side of the image.
      - name: Build dmg installer (macOS)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          V="$PIST_VERSION"
          rm -rf dmg-src && mkdir dmg-src
          ditto bundle/PiST.app dmg-src/PiST.app
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname PiST -srcfolder dmg-src -ov -format UDZO \
            "PiST-$V-macos-arm64.dmg"
          rm -rf dmgx && mkdir dmgx
          hdiutil attach -nobrowse -mountpoint dmgx "PiST-$V-macos-arm64.dmg" > /dev/null
          got=$(cd dmgx && find . -maxdepth 1 -mindepth 1 -print | sed 's|^\./||' | sort)
          want=$(printf '%s\n' Applications PiST.app | sort)
          if [ "$got" != "$want" ]; then
            echo "ERROR: the dmg root is not the app and Applications"
            echo "$got"
            hdiutil detach dmgx
            exit 1
          fi
          [ "$(readlink dmgx/Applications)" = "/Applications" ] \
            || { echo "ERROR: Applications is not a link to /Applications"; hdiutil detach dmgx; exit 1; }
          for f in PiST.app/Contents/MacOS/pist \
                   PiST.app/Contents/MacOS/vasmm68k_mot \
                   PiST.app/Contents/Frameworks/hatari_libretro.dylib \
                   PiST.app/Contents/share/emutos/etos1024k.img \
                   PiST.app/Contents/share/doc/pist/NOTICE \
                   PiST.app/Contents/share/doc/pist/licenses/vasm-LICENCE.txt \
                   PiST.app/Contents/Resources/pist.icns \
                   PiST.app/Contents/Resources/BUILD-INFO.txt; do
            [ -e "dmgx/$f" ] || { echo "ERROR: dmg lacks $f"; ls -R dmgx | head -30; hdiutil detach dmgx; exit 1; }
          done
          codesign --verify --deep --strict dmgx/PiST.app \
            || { echo "ERROR: the app in the dmg fails its signature check"; hdiutil detach dmgx; exit 1; }
          hdiutil detach dmgx > /dev/null
          echo "ASSET_DMG=PiST-$V-macos-arm64.dmg" >> "$GITHUB_ENV"

      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
          fi
          V="$PIST_VERSION"
          stage=$(python3 -c "import os,sys; print(os.path.abspath(sys.argv[1]).replace(chr(92), '/'))" bundle)
          cpack -G WIX --config build/CPackConfig.cmake \
            -D "CPACK_INSTALLED_DIRECTORIES=${stage};/" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D CPACK_PACKAGE_FILE_NAME="PiST-$V-windows-x86_64"
          [ -f "PiST-$V-windows-x86_64.msi" ] \
            || { echo "ERROR: no MSI produced"; exit 1; }
          # Assert inside the package the two things a clean machine complained
          # about: the CRT DLLs and a Start Menu shortcut. dark decompiles the
          # MSI — cabinet contents plus the .wxs — and ships in the same WiX
          # toolset this step installs; both gaps above shipped green precisely
          # because nothing ever looked inside the artifact.
          rm -rf msix && mkdir msix
          dark.exe -nologo -x msix -out msix/product.wxs "PiST-$V-windows-x86_64.msi"
          grep -rq "msvcp140.dll" msix/ \
            || { echo "ERROR: the MSI lacks the MSVC runtime"; ls -R msix | head -20; exit 1; }
          grep -q "<Shortcut" msix/product.wxs \
            || { echo "ERROR: the MSI has no Start Menu shortcut"; exit 1; }
          echo "ASSET_MSI=PiST-$V-windows-x86_64.msi" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-archive
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_DEB }}
            ${{ env.ASSET_RPM }}
            ${{ env.ASSET_DMG }}
            ${{ env.ASSET_MSI }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_DEB }}
            ${{ env.ASSET_RPM }}
            ${{ env.ASSET_DMG }}
            ${{ env.ASSET_MSI }}
          generate_release_notes: true
          # The notes live in the tree, reviewed like any other doc, instead of
          # inline here where they drifted from the workflow's own behaviour
          # once already (docs/agents/release-report.md).
          body_path: docs/release-notes.md
