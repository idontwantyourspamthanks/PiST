# Build the Hatari we actually support, rather than taking whatever the
# distribution ships. Ubuntu 24.04 packages 2.4.1 and 22.04 ships 2.3.1,
# while this project is developed and verified against 2.6.1 — and the
# difference is not cosmetic: running the suite against 2.4.1 produced
# truncated debugger responses and four failures that do not reproduce on
# 2.6.1 at all. Testing a version nobody will use is worse than useless,
# because the failures are noise and the passes are meaningless.
#
# This is also the build we intend to bundle in release archives, so the
# path is worth having proven. Pinned by checksum: an upstream change should
# fail loudly rather than quietly alter what is tested.
#
# It lives in a composite action rather than inline in a workflow because the
# test job and the release packaging job must build the same emulator. Three
# bugs in these steps — the Homebrew architecture mismatch, the macOS bundle's
# executable name, and a missing CMAKE_PREFIX_PATH — each had to be fixed once
# in the only copy that existed, and a second copy would drift away the same way.

name: Build Hatari
description: >-
  Builds the pinned Hatari from source on Linux (apt) and macOS (Homebrew),
  copies the resulting `hatari` binary into `destination`, and puts that
  directory on PATH. Windows is not supported.

inputs:
  version:
    description: 'Hatari version to build, without the leading `v` (for example 2.6.1).'
    required: false
    default: '2.6.1'
  sha256:
    description: >-
      SHA-256 of the v<version> source tarball. An upstream change should fail
      loudly rather than quietly alter what is tested.
    required: false
    default: 75f09c8deddb511b8c1574b84c507743097db9abc6edbb078f942efa8677547e
  destination:
    description: >-
      Absolute directory the built `hatari` binary is copied into. It is also
      appended to $GITHUB_PATH, so `hatari` resolves by name afterwards.
    required: true

  variant:
    description: >-
      'upstream' (the pinned hatari release tarball) or 'hrdb' (the tattlemuss
      fork at a pinned commit, adding the HRDB remote-debug listener).
    required: false
    default: 'upstream'
  binary-name:
    description: >-
      Name the binary is installed as. 'hatari' normally; CI builds the fork
      side by side with upstream as 'hatari-hrdb', while a release bundle ships
      the fork AS 'hatari' (it is the only emulator bundled).
    required: false
    default: 'hatari'
  hrdb-commit:
    description: 'tattlemuss/hatari commit the hrdb variant is pinned to.'
    required: false
    default: '21aa4cb76783eb1b141b917fa1976c9c01331d66'
  hrdb-sha256:
    description: 'SHA-256 of the pinned fork tarball at hrdb-commit.'
    required: false
    default: '61be3f026ff6e930a5bdf7fd25e5b755126ec678cea0c483d93a71f916be7a05'
outputs:
  path:
    description: Absolute path to the built `hatari` binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    # The platform check happens here rather than in the caller, so an
    # unsupported runner fails immediately and with an explanation. Windows is
    # refused up front: Hatari needs SDL2 development packages, and nothing here
    # wires those up for MSYS2 or MSVC — no Hatari package exists for MSYS2, so
    # the CI matrix test-builds Windows without ever exercising the emulator.
    # Saying that beats failing obscurely inside `cmake`.
    - name: Check the platform
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Linux|macOS) ;;
          *)
            echo "::error::Hatari can only be built on Linux and macOS; ${{ runner.os }} is not supported. Windows needs SDL2 development packages that are not wired up yet, so there is no emulator to build here."
            exit 1
            ;;
        esac

    # Version and checksum arrive as inputs, so the pin lives in one place and
    # every caller gets the same build. Pinned by checksum: an upstream change
    # should fail loudly rather than quietly alter what is tested. The hrdb
    # variant builds the tattlemuss fork at a pinned commit — the same
    # discipline, different upstream.
    - name: Fetch Hatari ${{ inputs.version }} (${{ inputs.variant }})
      shell: bash
      env:
        HATARI_VERSION: ${{ inputs.version }}
        HATARI_SHA256: ${{ inputs.sha256 }}
        HRDB_COMMIT: ${{ inputs.hrdb-commit }}
        HRDB_SHA256: ${{ inputs.hrdb-sha256 }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.variant }}" = "hrdb" ]; then
          curl -fsSL -o hatari.tar.gz "https://github.com/tattlemuss/hatari/archive/$HRDB_COMMIT.tar.gz"
          echo "$HRDB_SHA256  hatari.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$HRDB_SHA256  hatari.tar.gz" | sha256sum -c -
          tar xzf hatari.tar.gz
          ln -s "hatari-$HRDB_COMMIT" "hatari-$HATARI_VERSION"
        else
          HATARI_URL="https://github.com/hatari/hatari/archive/refs/tags/v$HATARI_VERSION.tar.gz"
          curl -fsSL -o hatari.tar.gz "$HATARI_URL"
          echo "$HATARI_SHA256  hatari.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$HATARI_SHA256  hatari.tar.gz" | sha256sum -c -
          tar xzf hatari.tar.gz
        fi

    - name: Install Hatari build dependencies
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt-get update -qq
          # libreadline-dev matters: with it, Hatari's debugger reads commands
          # through readline and prints its prompt to stdout. Without it, the
          # build falls back to fgets and prints the prompt to stderr, which is
          # a different transport path entirely — so the dependency is part of
          # what is being tested, not an incidental.
          sudo apt-get install -y -qq libsdl2-dev libpng-dev zlib1g-dev libreadline-dev
        else
          brew install sdl2 libpng pkg-config
        fi

    - name: Configure and build Hatari
      shell: bash
      env:
        HATARI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # On macOS, libpng and SDL2 live in the Homebrew prefix, which the
        # system CMake does not search by default — without this the link fails
        # on every `_png_*` symbol. pkg-config is installed for the same reason:
        # Hatari uses it to find capstone and friends.
        PREFIX_ARGS=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          # Homebrew on an Apple-silicon runner installs arm64 libraries, so the
          # build has to target the same architecture or the link fails with
          # every `_png_*` symbol unresolved. The runner's default toolchain is
          # not guaranteed to agree with the Homebrew prefix, so it is stated.
          BREW_PREFIX="$(brew --prefix)"
          case "$BREW_PREFIX" in
            /opt/homebrew) ARCH=arm64 ;;
            *)             ARCH=x86_64 ;;
          esac
          echo "Homebrew prefix: $BREW_PREFIX -> targeting $ARCH"
          PREFIX_ARGS="-DCMAKE_PREFIX_PATH=$BREW_PREFIX -DCMAKE_OSX_ARCHITECTURES=$ARCH"
        fi

        cmake -S "hatari-$HATARI_VERSION" -B hatari-build -DCMAKE_BUILD_TYPE=Release $PREFIX_ARGS
        cmake --build hatari-build --parallel

    - name: Install Hatari
      id: install
      shell: bash
      env:
        HATARI_DEST: ${{ inputs.destination }}
        BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        set -euo pipefail
        # macOS builds an application bundle, so the executable is named
        # `Hatari` inside Contents/MacOS rather than `hatari` at the top level.
        # The copy below lands it at the requested name either way.
        mkdir -p "$HATARI_DEST"
        HATARI_BIN=$(find hatari-build -type f -perm -u+x -iname hatari | head -1)
        if [ -z "$HATARI_BIN" ]; then
          echo "ERROR: no hatari executable produced; tree:"
          find hatari-build -maxdepth 4 -name '*atari*' | head -20
          exit 1
        fi
        cp "$HATARI_BIN" "$HATARI_DEST/$BINARY_NAME"
        echo "$HATARI_DEST" >> "$GITHUB_PATH"
        echo "path=$HATARI_DEST/$BINARY_NAME" >> "$GITHUB_OUTPUT"
