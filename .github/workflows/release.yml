name: Release

# Produces shippable archives containing PiST, the assembler, and a free ROM, so
# that a fresh download runs without the user installing anything.
#
# The assembler is bundled because vasm publishes no binaries for host platforms
# at all — only Amiga-family and Atari builds — so it has to be compiled here. Its
# licence permits redistribution unmodified for non-commercial use; see NOTICE.
# It is never patched: PiST drives it purely through command-line arguments.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VASM_URL: http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
  VASM_SHA256: c84b2de1cbb87831795fe64a85c5d9a7002a766e3a7c30b0a2d7d5e99d878f49
  # EmuTOS 1.4, the 1024k emulator build: one image that works on ST through
  # Falcon, and the same one Hatari itself ships. Verified to autostart a GEMDOS
  # HD program, which is what the run-and-debug path needs.
  EMUTOS_URL: https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-1024k-1.4.zip/download
  EMUTOS_SHA256: dc9fbef6455a24ee8955cccd565588c718ba675fd54bc5a749003ac4bbd7f7e1
  # The Qt the bundles deploy; collect-notices names it in the LGPL source
  # offer, so it must be the version install-qt-action actually installs.
  QT_VERSION: '6.8.1'

jobs:
  # ---------------------------------------------------------------------------
  # Build the assembler.
  #
  # The Windows build is cross-compiled here with mingw-w64 rather than built on a
  # Windows runner with MSYS2: it is one plain-C program with no platform API
  # beyond stdio, and a cross-built PE is then *run natively* by the Windows
  # release job, which verifies it more directly than building it there would.
  # macOS is built natively, since cross-compiling to Mach-O from Linux needs an
  # SDK we cannot ship here.
  # ---------------------------------------------------------------------------
  vasm-linux-windows:
    name: vasm (linux + windows)
    runs-on: ubuntu-latest
    steps:
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Fetch and verify vasm source
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | sha256sum -c -
          tar xzf vasm.tar.gz

      - name: Build for Linux
        run: make -C vasm CPU=m68k SYNTAX=mot

      - name: Build for Windows
        run: |
          set -euo pipefail
          cp -r vasm vasm-win
          make -C vasm-win CPU=m68k SYNTAX=mot CC=x86_64-w64-mingw32-gcc
          file vasm-win/vasmm68k_mot.exe

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-linux
          path: vasm/vasmm68k_mot
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-windows
          path: vasm-win/vasmm68k_mot.exe
          if-no-files-found: error

  vasm-macos:
    name: vasm (macos)
    runs-on: macos-15
    steps:
      - name: Fetch and verify vasm source
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c -
          tar xzf vasm.tar.gz

      - name: Build
        run: make -C vasm CPU=m68k SYNTAX=mot

      - uses: actions/upload-artifact@v4
        with:
          name: vasm-macos
          path: vasm/vasmm68k_mot
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build PiST, assemble the archive, and verify it before it is published.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.name }})
    needs: [vasm-linux-windows, vasm-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage rather than a plain tarball, because it is the only Linux
          # format that is self-contained, runs on distros other than the build
          # host, and sidesteps the archive-area policy problem of shipping a
          # non-free assembler (an AppImage is not a distro package, so the DFSG
          # does not apply — only vasm's own redistribution terms do).
          # emulator: only Linux bundles Hatari, and the comment below explains
          # why that is a capability difference rather than an oversight.
          - name: linux-x86_64
            os: ubuntu-22.04
            vasm_artifact: vasm-linux
            deployed: false
            emulator: true
          - name: macos-arm64
            os: macos-15
            vasm_artifact: vasm-macos
            deployed: true
            emulator: false
          - name: windows-x86_64
            os: windows-latest
            vasm_artifact: vasm-windows
            deployed: true
            emulator: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      # The licence terms of the bundled assembler live only in its source
      # tarball's manual, and they must travel with the binary — so the
      # packaging job needs the tarball, pinned exactly as the build jobs.
      - name: Fetch and verify the vasm source (for its licence)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o vasm.tar.gz "$VASM_URL"
          echo "$VASM_SHA256  vasm.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$VASM_SHA256  vasm.tar.gz" | sha256sum -c -

      # xvfb and the ALSA/X libraries are needed for two different reasons: xvfb to
      # run the AppImage at all (the offscreen plugin is deliberately not bundled),
      # and the libraries so that the AppImage has something to *fail* against. The
      # smoke test is dishonest if the runner happens to have everything.

      - name: Install the emulator and its libraries
        if: matrix.emulator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libsdl2-2.0-0 libreadline8 libpng16-16

      # Same action the test job uses, so the emulator that ships is one the
      # test suites ran against (the fork on the hrdb leg, upstream on the
      # native one). Only the Linux AppImage bundles it: on macOS
      # the archive is built from a bundle whose executable does not run
      # standalone (which is why the CI matrix has it switched off), and Windows
      # has no MSYS2 Hatari package. Both therefore still ask the user to install
      # Hatari, which the release notes say plainly.
      - name: 'Build Hatari (the bundled emulator: hrdb fork)'
        if: matrix.emulator
        uses: ./.github/actions/build-hatari
        with:
          # The bundled emulator is the hrdb-main FORK, installed as `hatari`:
          # one emulator, and PiST's content probe selects HRDB automatically
          # for it. The fork is upstream 2.6.1 plus the remote-debug listener,
          # so emulation is identical to what CI tests against upstream; the
          # native backend remains for user-supplied stock Hatari. GPL-2.0-or-
          # later like upstream, with the source offer naming the pinned fork
          # commit (NOTICE).
          variant: hrdb
          destination: ${{ github.workspace }}/bundle/bin

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.vasm_artifact }}
          path: bundle/bin

      # Artifacts do not preserve the executable bit, so a downloaded assembler is
      # present but not runnable, and discovery rightly skips it — which shipped an
      # archive whose bundled assembler was reported NOT FOUND. Restore the mode
      # before it is used or packaged; tar preserves it, so the archive is correct.
      - name: Make the assembler executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bundle/bin/vasmm68k_mot
          ls -l bundle/bin/

      - name: Fetch and verify EmuTOS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o emutos.zip "$EMUTOS_URL"
          echo "$EMUTOS_SHA256  emutos.zip" | shasum -a 256 -c - 2>/dev/null \
            || echo "$EMUTOS_SHA256  emutos.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          with zipfile.ZipFile("emutos.zip") as z:
              name = next(n for n in z.namelist() if n.endswith("etos1024k.img"))
              z.extract(name, "emutos-extract")
          dest = pathlib.Path("bundle/share/emutos")
          dest.mkdir(parents=True, exist_ok=True)
          src = next(pathlib.Path("emutos-extract").rglob("etos1024k.img"))
          shutil.copy(src, dest / "etos1024k.img")
          print("ROM:", dest / "etos1024k.img")
          PY

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          gen=()
          if [ "${{ runner.os }}" = "macOS" ] && command -v ninja >/dev/null 2>&1; then
            gen=(-G Ninja)
          fi
          cmake -S . -B build "${gen[@]}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # Deploy the Qt runtime so the archive runs on a machine without Qt
      # installed. Without this the binary links against the Qt it was built with
      # and fails to start elsewhere — the same failure the CI install step hit
      # on macOS as "Library not loaded: @rpath/QtWidgets.framework/...".
      - name: Deploy Qt runtime (macOS)
        if: matrix.deployed && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp -R build/pist.app bundle/
          macdeployqt bundle/pist.app -always-overwrite
          # The assembler belongs beside the executable inside the bundle, which
          # is where discovery looks first, so the archive stays self-sufficient
          # wherever it is unpacked from.
          cp bundle/bin/vasmm68k_mot bundle/pist.app/Contents/MacOS/
          rm -rf bundle/bin
          find bundle -maxdepth 4 -type f | head -20

      - name: Deploy Qt runtime (Windows)
        if: matrix.deployed && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin
          cp build/Release/pist.exe bundle/bin/
          windeployqt --release --no-translations bundle/bin/pist.exe

      - name: Copy binary (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin
          cp build/pist bundle/bin/

      # The AppImage bundles Qt (including the xcb platform plugin, xcbgl
      # integrations and the TLS backends Qt6::Network needs), so it runs on a
      # machine with no Qt installed. Build on the oldest runner we support: glibc
      # is backward-compatible but not forward-compatible, so the build host sets
      # the floor for every distro the AppImage will run on.
      - name: Build AppImage (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail

          LD=linuxdeploy-x86_64.AppImage
          LDQ=linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o "$LD" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/$LD
          curl -fsSL -o "$LDQ" https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/$LDQ
          chmod +x "$LD" "$LDQ"

          # Stage an AppDir from the normal install tree, so packaging cannot drift
          # from what `cmake --install` produces.
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp packaging/icons/pist-256.png AppDir/usr/share/icons/hicolor/256x256/apps/pist.png

          # Bundle the tools the archive carries, beside the executable, which is
          # the first place tool discovery looks. One matrix flag drives both the
          # copy and the `-e` below, because splitting them means the AppImage
          # builds the moment the flag is flipped and then fails confusingly; kept
          # together, a no-emulator build is simply a smaller AppImage.
          cp bundle/bin/vasmm68k_mot AppDir/usr/bin/
          mkdir -p AppDir/usr/share/emutos
          cp bundle/share/emutos/etos1024k.img AppDir/usr/share/emutos/
          EXE_ARGS=(-e AppDir/usr/bin/pist)
          if [ "${{ matrix.emulator }}" = "true" ]; then
            cp bundle/bin/hatari AppDir/usr/bin/
            EXE_ARGS+=(-e AppDir/usr/bin/hatari)
          fi

          # The licence texts must be inside the AppDir before linuxdeploy
          # consumes it (a second pass is not an option: re-running the qt
          # plugin on a populated AppDir demands QML tooling a fresh AppDir
          # does not need). The set is derived from what was actually staged —
          # including the libraries the bundled Hatari links (Capstone comes
          # and goes with the build host) — so the notices cannot drift from
          # the bytes we ship. Qt lands during the deploy itself, hence
          # --expect-qt; the final artifact's notices are asserted below.
          python3 packaging/collect-notices.py --root AppDir/usr --platform linux \
            --qt-version "$QT_VERSION" --vasm-tarball vasm.tar.gz --expect-qt


          export QMAKE="$(command -v qmake6 || command -v qmake)"

          # Both executables are named with -e, which is what makes linuxdeploy
          # bundle the libraries they need that are NOT universal on a desktop:
          # with only `pist` named, the bundled Hatari arrived without SDL2,
          # libreadline or libpng and could not start.
          #
          # X11, Wayland, libdrm, libgbm and libasound are deliberately NOT
          # bundled, and that is linuxdeploy's own choice rather than an
          # oversight: every desktop Linux has them, and copying them from the
          # build host is actively dangerous. A library copied from a newer host
          # can demand a glibc the user does not have — copying libtinfo from a
          # development machine produced "version `GLIBC_2.42' not found" on a
          # 2.39 system, turning a working archive into a broken one. Testing in a
          # headless container therefore proves less than it appears to: a missing
          # libasound there is not a defect, because no desktop lacks it.
          ./"$LD" --appdir AppDir \
            "${EXE_ARGS[@]}" \
            -d AppDir/usr/share/applications/pist.desktop \
            -i packaging/icons/pist-256.png \
            --plugin qt --output appimage


          APPIMAGE=$(ls PiST-*.AppImage | head -1)
          echo "built $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"

          # Verify what will actually be published, by running the bundled
          # emulator itself rather than only asking pist where it thinks the
          # emulator is. An emulator that cannot start is the failure this step
          # exists to catch, and `--diagnose` would report it as present.
          echo "--- extracting the published AppImage to inspect it ---"
          rm -rf verify-appimage && mkdir -p verify-appimage
          (cd verify-appimage && "../$APPIMAGE" --appimage-extract > /dev/null)

          if [ ! -x verify-appimage/squashfs-root/usr/bin/hatari ]; then
            echo "ERROR: no emulator inside the AppImage"
            exit 1
          fi
          # Asserted on the output rather than the exit status, because Hatari
          # exits 1 from --version while printing a perfectly good banner (it
          # reports the version and then fails its own "no ROM specified" path).
          # An emulator that cannot load its libraries produces a dynamic-linker
          # error and no banner at all, so the banner is the signal that matters;
          # `&& exit 1` here would have failed a working build.
          echo "--- bundled hatari --version ---"
          verify-appimage/squashfs-root/usr/bin/hatari --version > hatari-version.txt 2>&1 || true
          sed -n '1,3p' hatari-version.txt
          if ! grep -qE 'Hatari v[0-9]+\.[0-9]+' hatari-version.txt; then
            echo "ERROR: the bundled emulator does not start. Output was:"
            cat hatari-version.txt
            exit 1
          fi

          # The libraries linuxdeploy must be bundling, because a desktop without
          # them exists. SDL2 in particular is not universally installed, whereas
          # the excluded X11/ALSA set effectively is.
          for lib in libSDL2-2.0 libreadline libpng; do
            if ! find verify-appimage/squashfs-root/usr/lib -name "$lib*" | grep -q .; then
              echo "ERROR: $lib was not bundled; the emulator needs it"
              exit 1
            fi
          done

          # The notices must travel too, and they must be the generated set.
          for f in THIRD-PARTY.txt licenses/GPL-2.0.txt licenses/GPL-3.0.txt \
                   licenses/LGPL-3.0.txt licenses/zlib.txt licenses/SDL2-LICENSE.txt \
                   licenses/libpng.txt licenses/vasm-LICENCE.txt; do
            if [ ! -f "verify-appimage/squashfs-root/usr/share/doc/pist/$f" ]; then
              echo "ERROR: the AppImage lacks doc/pist/$f"
              exit 1
            fi
          done
          echo "OK: emulator starts and its non-universal libraries are bundled"

          echo "--- $APPIMAGE --diagnose ---"
          # Run through xvfb: the offscreen platform plugin is not bundled, and
          # xcb is what a user gets. A real display is closer to the shipped
          # configuration than a plugin that is not in the archive.
          mkdir -p fakehome
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            xvfb-run -a "./$APPIMAGE" --diagnose > diagnose-appimage.txt 2>&1 || true
          cat diagnose-appimage.txt

          # The same assertions the archive job makes, applied to the AppImage —
          # and pointedly WITHOUT PIST_TOS_DIR, so that the discovery logic a user
          # depends on is the logic being tested. The archive check sets that
          # variable, which is why a bundled ROM that nothing searched still passed
          # the release gate.
          for needle in vasmm68k_mot hatari EmuTOS; do
            if ! grep -q "$needle" diagnose-appimage.txt; then
              echo "ERROR: the AppImage did not report $needle"
              exit 1
            fi
          done

          # The bundled emulator must be the HRDB fork: the content probe is
          # what selects the transport, so an upstream binary here would
          # silently ship the wrong debug channel.
          if ! grep -q 'transport: hrdb' diagnose-appimage.txt; then
            echo "ERROR: the bundled emulator is not the HRDB fork:"
            cat diagnose-appimage.txt
            exit 1
          fi
          # And the ROM it must be *using* has to be the one inside the AppImage,
          # not a system copy that happened to be on the runner. A user without the
          # hatari package has no system copy, so this is the case that matters.
          # The EmuTOS line is matched by its path rather than a leading version
          # number, because EmuTOS does not render as one: it prints
          # "EmuTOS (TOS 2.06)<TAB>/tmp/.mount_.../usr/share/emutos/etos1024k.img",
          # and an earlier version of this check expected a number and therefore
          # passed on a machine where only the system ROMs were found.
          if ! grep -qE '/tmp/\.mount_[^[:space:]]+/usr/share/emutos/etos1024k\.img' diagnose-appimage.txt; then
            echo "ERROR: the AppImage did not find its own bundled ROM:"
            cat diagnose-appimage.txt
            exit 1
          fi
          # The bundled ROM must also be usable, not merely present. "cannot
          # autostart" would mean the GEMDOS-hard-disk run path is broken, which is
          # what Run and debug both need. Matched on the EmuTOS line itself, so a
          # system 1.02 ROM — which always carries that warning — does not produce
          # a false failure.
          if grep -E 'etos1024k\.img' diagnose-appimage.txt | grep -q 'cannot autostart'; then
            echo "ERROR: the bundled EmuTOS cannot autostart a program"
            exit 1
          fi

          echo "ASSET=$APPIMAGE" >> "$GITHUB_ENV"
          echo "APPIMAGE=1" >> "$GITHUB_ENV"

      # Installers from the same staged tree the AppImage carries: the deb/rpm
      # and the AppImage are byte-identical content — bundled Qt, fork, vasm,
      # ROM, licences and notices. CPACK_INSTALL_CMAKE_PROJECTS="" suppresses
      # the project's own install rules so the package holds the staged tree
      # and nothing else (a naive cpack doubles the payload with both).
      - name: Build deb and rpm installers (Linux)
        if: '!matrix.deployed'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rpm
          V="${{ github.ref_name }}"
          [ -n "$V" ] || V="dev"
          # CMake 4's RelativePath requires an absolute directory; a relative
          # AppDir produced empty symlink names and aborted the package.
          stage=$(python3 -c "import os,sys; print(os.path.abspath(sys.argv[1]).replace(chr(92), '/'))" AppDir)
          COMMON=(-D "CPACK_INSTALLED_DIRECTORIES=${stage};/"
                  -D "CPACK_INSTALL_CMAKE_PROJECTS=")
          cpack -G DEB "${COMMON[@]}" --config build/CPackConfig.cmake \
            -D CPACK_PACKAGE_FILE_NAME="pist-$V-linux-amd64"
          cpack -G RPM "${COMMON[@]}" --config build/CPackConfig.cmake \
            -D CPACK_PACKAGE_FILE_NAME="pist-$V-linux-x86_64"

          # The packages must be self-contained: the packaged pist resolves
          # its bundled Qt, tools and ROM from the staged tree, not the host.
          rm -rf debx && mkdir debx
          dpkg-deb -x "pist-$V-linux-amd64.deb" debx
          env -i HOME="$PWD/fakehome" PATH=/usr/bin:/bin \
            xvfb-run -a debx/usr/bin/pist --diagnose > diagnose-deb.txt 2>&1 || true
          for needle in vasmm68k_mot hatari EmuTOS; do
            grep -q "debx/usr" diagnose-deb.txt || { echo "ERROR: deb not self-contained ($needle)"; cat diagnose-deb.txt; exit 1; }
          done
          rpm -qip "pist-$V-linux-x86_64.rpm" | grep -E "^(Name|Version|License)"

          echo "ASSET_DEB=pist-$V-linux-amd64.deb" >> "$GITHUB_ENV"
          echo "ASSET_RPM=pist-$V-linux-x86_64.rpm" >> "$GITHUB_ENV"

      - name: Add documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/share/doc/pist
          cp LICENSE NOTICE README.md bundle/share/doc/pist/

      # Same derivation for the plain archives. Windows cannot inspect linked
      # libraries and bundles no emulator, so its set is the static one.
      - name: Generate third-party notices
        if: matrix.deployed
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=macos
          [ "${{ runner.os }}" = "Windows" ] && PLATFORM=windows
          python3 packaging/collect-notices.py --root bundle --platform "$PLATFORM" \
            --qt-version "$QT_VERSION" --vasm-tarball vasm.tar.gz

      # The point of the exercise: prove the packaged archive resolves the
      # assembler *it* carries, rather than one on the machine building it.
      - name: Verify the bundle resolves its own tools
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PIST_TOS_DIR: ${{ github.workspace }}/bundle/share/emutos
        run: |
          set -euo pipefail
          BIN=bundle/bin/pist
          [ -f "$BIN" ] || BIN="$BIN.exe"
          # On macOS the executable lives inside the .app bundle.
          [ -f "$BIN" ] || BIN=bundle/pist.app/Contents/MacOS/pist
          echo "--- $BIN --diagnose ---"
          "$BIN" --diagnose | tee diagnose.txt

          echo
          echo "Asserting the archive is self-sufficient..."

          # Compare by resolving what was actually reported rather than by
          # string-matching a path we compute here: Git-bash reports
          # /d/a/PiST/... while Qt reports D:/a/PiST/..., so an equality test
          # against a locally derived path fails on Windows for reasons that have
          # nothing to do with the bundle.
          reported="$(grep -F 'Assembler (vasmm68k_mot):' diagnose.txt \
                      | head -1 | sed 's/^Assembler (vasmm68k_mot): //' | tr -d '\r')"

          if [ "$reported" = "NOT FOUND" ] || [ -z "$reported" ]; then
            echo "ERROR: no assembler was found at all"
            exit 1
          fi
          if [ ! -f "$reported" ]; then
            echo "ERROR: the reported assembler does not exist: $reported"
            exit 1
          fi
          # It must be the copy travelling in this archive, not one installed on
          # the build machine — a bundle that ships a binary it does not use is
          # the failure this check exists to catch.
          case "$reported" in
            *bundle*) ;;
            *) echo "ERROR: resolved assembler is outside the bundle: $reported"; exit 1 ;;
          esac
          # And it must be byte-identical to what we packaged, which proves it is
          # our build rather than a same-named file that happened to be nearby.
          if ! cmp -s "$reported" "$(dirname "$reported")/vasmm68k_mot" \
             && ! cmp -s "$reported" "$(dirname "$reported")/vasmm68k_mot.exe"; then
            echo "ERROR: the resolved assembler is not the packaged one"
            exit 1
          fi

          # The ROM it carries must be recognised and usable: one that cannot
          # autostart would break the Run path, so copying a file in is not enough.
          if ! grep -q 'EmuTOS' diagnose.txt; then
            echo "ERROR: the bundled ROM was not found"
            exit 1
          fi
          if grep -q 'cannot autostart' diagnose.txt; then
            echo "ERROR: the bundled ROM cannot autostart a program"
            exit 1
          fi

          echo "OK: bundled assembler and ROM both resolved"

      - name: Write build metadata
        shell: bash
        run: |
          {
            echo "PiST ${{ github.ref_name }} (${{ matrix.name }})"
            echo "built from ${{ github.sha }}"
            echo
            cat diagnose.txt
          } > bundle/BUILD-INFO.txt

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          # Linux already produced its asset (the AppImage) above; the others get
          # an archive.
          if [ -n "${APPIMAGE:-}" ]; then
            ls -l "$ASSET"
            exit 0
          fi

          # The generated notices must be inside what ships — asserting on the
          # tree being archived, not on the script having run.
          for f in THIRD-PARTY.txt licenses/LGPL-3.0.txt licenses/vasm-LICENCE.txt; do
            if [ ! -f "bundle/share/doc/pist/$f" ]; then
              echo "ERROR: the archive lacks doc/pist/$f"
              exit 1
            fi
          done

          V="${{ github.ref_name }}"
          [ -n "$V" ] || V="dev"
          NAME="pist-$V-${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" ./bundle/* > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" bundle
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l "$NAME".*

      # The dmg/MSI installers pack the same bundle/ the archives carry, so an
      # installer and its archive are byte-identical content. The project's own
      # install rules are suppressed so only the staged tree ships.
      - name: Build dmg installer (macOS)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.ref_name }}"
          [ -n "$V" ] || V="dev"
          stage=$(python3 -c "import os,sys; print(os.path.abspath(sys.argv[1]).replace(chr(92), '/'))" bundle)
          cpack -G DragNDrop --config build/CPackConfig.cmake \
            -D "CPACK_INSTALLED_DIRECTORIES=${stage};/" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D CPACK_PACKAGE_FILE_NAME="PiST-$V-macos-arm64"
          # Assert the installer carries what the archive has.
          rm -rf dmgx && mkdir dmgx
          hdiutil attach -nobrowse -mountpoint dmgx "PiST-$V-macos-arm64.dmg" > /dev/null
          for f in pist.app/Contents/MacOS/pist share/emutos/etos1024k.img \
                   share/doc/pist/NOTICE share/doc/pist/licenses/vasm-LICENCE.txt; do
            [ -e "dmgx/$f" ] || { echo "ERROR: dmg lacks $f"; ls -R dmgx | head -20; hdiutil detach dmgx; exit 1; }
          done
          hdiutil detach dmgx > /dev/null
          echo "ASSET_DMG=PiST-$V-macos-arm64.dmg" >> "$GITHUB_ENV"

      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
          fi
          V="${{ github.ref_name }}"
          [ -n "$V" ] || V="dev"
          stage=$(python3 -c "import os,sys; print(os.path.abspath(sys.argv[1]).replace(chr(92), '/'))" bundle)
          cpack -G WIX --config build/CPackConfig.cmake \
            -D "CPACK_INSTALLED_DIRECTORIES=${stage};/" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D CPACK_PACKAGE_FILE_NAME="PiST-$V-windows-x86_64"
          [ -f "PiST-$V-windows-x86_64.msi" ] \
            || { echo "ERROR: no MSI produced"; exit 1; }
          echo "ASSET_MSI=PiST-$V-windows-x86_64.msi" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-archive
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_DEB }}
            ${{ env.ASSET_RPM }}
            ${{ env.ASSET_DMG }}
            ${{ env.ASSET_MSI }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_DEB }}
            ${{ env.ASSET_RPM }}
            ${{ env.ASSET_DMG }}
            ${{ env.ASSET_MSI }}
          generate_release_notes: true
          body: |
            PiST — an IDE for Atari ST assembly development.

            Every archive contains PiST, the `vasmm68k_mot` assembler, and an
            EmuTOS ROM. The Linux AppImage additionally contains the Hatari
            emulator, so on Linux it runs and debugs with nothing else installed.

            **Assembler:** vasm is not free software. It is redistributed
            unmodified and for non-commercial use, which its licence permits; see
            `share/doc/pist/NOTICE`. PiST never patches it.

            **ROM:** EmuTOS 1.4 (GPLv2), a free TOS replacement. Original Atari
            TOS images are copyrighted and are not included — supply your own in
            Project Settings if you need one.

            **Emulator:** the Linux AppImage bundles the hrdb-main fork of Hatari
            (upstream 2.6.1 plus the remote-debug listener PiST's HRDB transport
            uses), GPL-2.0-or-later, built unmodified from a checksum-pinned
            commit tarball (it never patches it and runs it as a separate
            process). The macOS and Windows
            archives do **not** include it: there install Hatari yourself, or point
            PiST at one in Project Settings. Use 2.5 or later — 2.4.1 returns
            truncated debugger responses that break source-line debugging, and
            Ubuntu 24.04 ships exactly that, so a distribution package is often not
            recent enough. See `share/doc/pist/NOTICE` for the full licence details,
            including the GNU Readline that the bundled build links.

            ### Linux

            Nothing else to install: assemble, run and debug straight away.

            `pist-*-linux-x86_64.AppImage` is self-contained — Qt, the assembler,
            the emulator and the ROM are all inside it:

            ```sh
            chmod +x pist-*-linux-x86_64.AppImage
            ./pist-*-linux-x86_64.AppImage your-program.s
            ```

            It is built on Ubuntu 22.04, so it needs glibc 2.35 or newer (Ubuntu
            22.04+, Debian 12+, Fedora 36+, and anything more recent).

            ### What works

            Write, assemble, run and debug: source-line and conditional
            breakpoints, stepping, step-over, registers, a memory viewer, and
            labelled disassembly, with the editor following the program counter.
            Projects keep their settings — include paths, defines, target CPU,
            machine, ROM, RAM and disk images — in a small JSON file beside the
            source.

            ### Known limitations

            - **The emulator integration has only been exercised on Linux**, which
              is now the one platform that runs the emulator test suite against a
              real Hatari. Windows has no Hatari package for MSYS2, and the macOS
              Hatari build produces an application bundle whose executable does not
              start standalone, so neither runner can exercise it. Assembling and
              debugging on Windows and macOS is therefore untested. Reports from
              real machines are welcome.
            - **On Windows**, pausing, changing breakpoints while running, and
              swapping disks at runtime are unavailable — Hatari compiles its
              control channel only on POSIX systems. Breakpoints and stepping
              work regardless.
            - **No installers**: these are tarballs and zips.
            - **No linker step**: multi-file builds via include paths work, but
              separate compilation and vlink are not yet supported.
            - The interface is functional rather than polished.

            Run `pist --diagnose` to see which assembler, emulator and ROMs PiST
            can find, and the paths it searched.
