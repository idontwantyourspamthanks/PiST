# Build the Hatari we actually support, rather than taking whatever the
# distribution ships. Ubuntu 24.04 packages 2.4.1 and 22.04 ships 2.3.1,
# while this project is developed and verified against 2.6.1 — and the
# difference is not cosmetic: running the suite against 2.4.1 produced
# truncated debugger responses and four failures that do not reproduce on
# 2.6.1 at all. Testing a version nobody will use is worse than useless,
# because the failures are noise and the passes are meaningless.
#
# This is also the build we intend to bundle in release archives, so the
# path is worth having proven. Pinned by checksum: an upstream change should
# fail loudly rather than quietly alter what is tested.
#
# It lives in a composite action rather than inline in a workflow because the
# test job and the release packaging job must build the same emulator. Three
# bugs in these steps — the Homebrew architecture mismatch, the macOS bundle's
# executable name, and a missing CMAKE_PREFIX_PATH — each had to be fixed once
# in the only copy that existed, and a second copy would drift away the same way.

name: Build Hatari
description: >-
  Builds the pinned Hatari from source on Linux (apt), macOS (Homebrew) and
  Windows (MSYS2 ucrt64), copies the resulting `hatari` binary into
  `destination`, and puts that directory on PATH.

inputs:
  version:
    description: 'Hatari version to build, without the leading `v` (for example 2.6.1).'
    required: false
    default: '2.6.1'
  sha256:
    description: >-
      SHA-256 of the v<version> source tarball. An upstream change should fail
      loudly rather than quietly alter what is tested.
    required: false
    default: 75f09c8deddb511b8c1574b84c507743097db9abc6edbb078f942efa8677547e
  destination:
    description: >-
      Absolute directory the built `hatari` binary is copied into. It is also
      appended to $GITHUB_PATH, so `hatari` resolves by name afterwards.
    required: true

  variant:
    description: >-
      'upstream' (the pinned hatari release tarball) or 'hrdb' (the tattlemuss
      fork at a pinned commit, adding the HRDB remote-debug listener).
    required: false
    default: 'upstream'
  binary-name:
    description: >-
      Name the binary is installed as. 'hatari' normally; CI builds the fork
      side by side with upstream as 'hatari-hrdb', while a release bundle ships
      the fork AS 'hatari' (it is the only emulator bundled).
    required: false
    default: 'hatari'
  hrdb-commit:
    description: 'tattlemuss/hatari commit the hrdb variant is pinned to.'
    required: false
    default: '21aa4cb76783eb1b141b917fa1976c9c01331d66'
  hrdb-sha256:
    description: 'SHA-256 of the pinned fork tarball at hrdb-commit.'
    required: false
    default: '61be3f026ff6e930a5bdf7fd25e5b755126ec678cea0c483d93a71f916be7a05'
outputs:
  path:
    description: Absolute path to the built `hatari` binary.
    # One of the two install steps always runs and the other always skips, so
    # exactly one of these expressions is non-empty.
    value: ${{ steps.install.outputs.path }}${{ steps.install-win.outputs.path }}

runs:
  using: composite
  steps:
    - name: Check the platform
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Linux|macOS|Windows) ;;
          *)
            echo "::error::Hatari can only be built on Linux, macOS and Windows; ${{ runner.os }} is not supported."
            exit 1
            ;;
        esac

    # Version and checksum arrive as inputs, so the pin lives in one place and
    # every caller gets the same build. Pinned by checksum: an upstream change
    # should fail loudly rather than quietly alter what is tested. The hrdb
    # variant builds the tattlemuss fork at a pinned commit — the same
    # discipline, different upstream.
    - name: Fetch Hatari ${{ inputs.version }} (${{ inputs.variant }})
      shell: bash
      env:
        HATARI_VERSION: ${{ inputs.version }}
        HATARI_SHA256: ${{ inputs.sha256 }}
        HRDB_COMMIT: ${{ inputs.hrdb-commit }}
        HRDB_SHA256: ${{ inputs.hrdb-sha256 }}
      run: |
        set -euo pipefail
        # Both variants normalise to a variant-keyed source directory. The
        # obvious alternative — extracting as hatari-<version> and symlinking
        # that name for the hrdb variant — silently breaks when the action is
        # invoked twice in one workspace (as ci.yml does): `ln -s` into an
        # existing real directory creates the link *inside* it, and the second
        # invocation then builds upstream again, producing a "fork" binary
        # with no HRDB listener. That exact failure cost a CI cycle.
        if [ "${{ inputs.variant }}" = "hrdb" ]; then
          curl -fsSL -o hatari.tar.gz "https://github.com/tattlemuss/hatari/archive/$HRDB_COMMIT.tar.gz"
          echo "$HRDB_SHA256  hatari.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$HRDB_SHA256  hatari.tar.gz" | sha256sum -c -
          tar xzf hatari.tar.gz
          mv "hatari-$HRDB_COMMIT" "hatari-src-hrdb"
        else
          HATARI_URL="https://github.com/hatari/hatari/archive/refs/tags/v$HATARI_VERSION.tar.gz"
          curl -fsSL -o hatari.tar.gz "$HATARI_URL"
          echo "$HATARI_SHA256  hatari.tar.gz" | shasum -a 256 -c - 2>/dev/null \
            || echo "$HATARI_SHA256  hatari.tar.gz" | sha256sum -c -
          tar xzf hatari.tar.gz
          mv "hatari-$HATARI_VERSION" "hatari-src-upstream"
        fi

    - name: Install Hatari build dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt-get update -qq
          # readline is deliberately NOT installed here, and the configure step
          # below disables Hatari's readline detection outright. Two reasons,
          # the first of which is a hard constraint:
          #
          #   - Linking readline into this Hatari is not permitted. Three files
          #     Hatari compiles in — src/cpu/uae/{attributes,types,vm}.h — grant
          #     GPL version 2 alone, with no "or later", so the binary built
          #     here can only be conveyed under GPLv2; readline is GPL version 3
          #     or later, and v3 code does not join a v2-capped work. That is
          #     the whole of MAJ-58, and NOTICE carries the detail.
          #   - The disabled find is also what makes the build deterministic:
          #     with the flag, it does not matter whether the runner image
          #     happens to ship readline, so a build cannot silently become a
          #     configuration we are not allowed to ship.
          #
          # Functionally this loses nothing: without readline the debugger
          # prints its prompt to stderr (src/debug/debugui.c, the fgets
          # fallback) instead of stdout, and PiST frames a command on the `> `
          # prompt on either stream. The tests run against that configuration.
          sudo apt-get install -y -qq libsdl2-dev libpng-dev zlib1g-dev
        else
          # readline is left out here for the licence reason above, and the
          # configure step disables its detection on every platform — so the
          # Homebrew keg-only prefix that used to be named explicitly for it is
          # gone as well.
          brew install sdl2 libpng pkg-config
        fi

    # Windows builds with MSYS2 ucrt64. The `msys2` shell is not a runner
    # built-in — it is registered by setup-msys2, which must run first (here in
    # the action, so every caller gets it) and also installs the dependencies.
    # No readline here either, for the licence reason given above; Windows
    # would not need it in any case, because the only Windows build we make is
    # the hrdb fork, whose debugger channels are HRDB's TCP socket — its stdin
    # is never read, so the readline/fgets prompt difference does not apply.
    - name: Set up MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-SDL2
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-zlib

    - name: Configure and build Hatari
      if: runner.os != 'Windows'
      shell: bash
      env:
        HATARI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # On macOS, libpng and SDL2 live in the Homebrew prefix, which the
        # system CMake does not search by default — without this the link fails
        # on every `_png_*` symbol. pkg-config is installed for the same reason:
        # Hatari uses it to find capstone and friends.
        PREFIX_ARGS=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          # Homebrew on an Apple-silicon runner installs arm64 libraries, so the
          # build has to target the same architecture or the link fails with
          # every `_png_*` symbol unresolved. The runner's default toolchain is
          # not guaranteed to agree with the Homebrew prefix, so it is stated.
          BREW_PREFIX="$(brew --prefix)"
          case "$BREW_PREFIX" in
            /opt/homebrew) ARCH=arm64 ;;
            *)             ARCH=x86_64 ;;
          esac
          echo "Homebrew prefix: $BREW_PREFIX -> targeting $ARCH"
          # ENABLE_OSX_BUNDLE defaults to ON on Apple and produces a binary
          # that only runs from inside Hatari.app (SDL_MAIN_NEEDED, an
          # @executable_path rpath and a ../Resources data dir) — useless to a
          # subprocess-driven debugger. Homebrew's own formula disables it the
          # same way, and its `hatari -v` test proves the result standalone.
          PREFIX_ARGS="-DCMAKE_PREFIX_PATH=$BREW_PREFIX -DCMAKE_OSX_ARCHITECTURES=$ARCH -DENABLE_OSX_BUNDLE=OFF"
        fi
        # Pin the build to Hatari *without* readline. The flag below covers
        # Linux and macOS; the Windows step needs no flag, since MSYS2 ucrt64
        # has no readline installed and its build cannot find one.
        # CMAKE_DISABLE_FIND_PACKAGE_Readline is CMake's own way of making a
        # find_package() call report not-found without touching the project's
        # source: Hatari's CMakeLists.txt then leaves HAVE_LIBREADLINE unset,
        # src/debug/CMakeLists.txt does not add the readline include
        # directory, and src/CMakeLists.txt does not link the library. The
        # debugger takes its `fgets` fallback instead. The reason is licensing
        # (see the dependency step above): readline is GPLv3-or-later and the
        # binary this produces is capped at GPLv2 by three GPL-2.0-only files
        # in src/cpu/uae/. The flag, not the runner's package set, is what
        # decides — so the configuration cannot drift with the image.
        #
        # macOS used to arrive at the same place by accident: Hatari's CMake
        # finds brew's readline but its rl_filename_completion_function link
        # probe fails, so HAVE_LIBREADLINE stayed off there. Stating the
        # intent turns that accident into the configuration.
        cmake -S "hatari-src-${{ inputs.variant }}" -B "hatari-build-${{ inputs.variant }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Readline=ON $PREFIX_ARGS
        cmake --build "hatari-build-${{ inputs.variant }}" --parallel

    - name: Configure and build Hatari (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        # Selects the ucrt64 toolchain: PATH gains /ucrt64/bin, so cmake, gcc
        # and ninja below are the mingw variants, not the msys ones.
        MSYSTEM: UCRT64
      run: |
        set -euo pipefail
        cmake -S "hatari-src-${{ inputs.variant }}" -B "hatari-build-${{ inputs.variant }}" \
          -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build "hatari-build-${{ inputs.variant }}" --parallel

    - name: Install Hatari
      if: runner.os != 'Windows'
      id: install
      shell: bash
      env:
        HATARI_DEST: ${{ inputs.destination }}
        BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        set -euo pipefail
        # With ENABLE_OSX_BUNDLE=OFF every platform produces a plain `hatari`
        # executable; the find stays defensive about where the build tree puts it.
        mkdir -p "$HATARI_DEST"
        HATARI_BIN=$(find "hatari-build-${{ inputs.variant }}" -type f -perm -u+x -iname hatari | head -1)
        if [ -z "$HATARI_BIN" ]; then
          echo "ERROR: no hatari executable produced; tree:"
          find "hatari-build-${{ inputs.variant }}" -maxdepth 4 -name '*atari*' | head -20
          exit 1
        fi
        cp "$HATARI_BIN" "$HATARI_DEST/$BINARY_NAME"
        echo "$HATARI_DEST" >> "$GITHUB_PATH"
        echo "path=$HATARI_DEST/$BINARY_NAME" >> "$GITHUB_OUTPUT"

    - name: Install Hatari (Windows)
      if: runner.os == 'Windows'
      id: install-win
      shell: msys2 {0}
      env:
        HATARI_DEST: ${{ inputs.destination }}
        BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        set -euo pipefail
        mkdir -p "$HATARI_DEST"
        BIN="hatari-build-${{ inputs.variant }}/src/hatari.exe"
        if [ ! -f "$BIN" ]; then
          echo "ERROR: no hatari.exe produced; tree:"
          find "hatari-build-${{ inputs.variant }}" -maxdepth 4 -name '*atari*' | head -20
          exit 1
        fi
        cp "$BIN" "$HATARI_DEST/$BINARY_NAME.exe"
        # The exe needs its mingw runtime DLLs beside it: stage everything ldd
        # resolves inside the ucrt64 sysroot (SDL2, libpng, zlib, the GCC
        # runtime). System DLLs under C:\Windows exist on every machine and
        # are not copied.
        ldd "$BIN" | awk '/ucrt64/ {print $3}' | while read -r dll; do
          cp "$dll" "$HATARI_DEST/"
        done
        ls -l "$HATARI_DEST"
        echo "$(cygpath -m "$HATARI_DEST")" >> "$GITHUB_PATH"
        echo "path=$(cygpath -m "$HATARI_DEST")/$BINARY_NAME.exe" >> "$GITHUB_OUTPUT"
